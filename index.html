/* ============================================================
   MENU + CART
   ============================================================ */

/* Which items belong on the board right now. On a closed day the
   whole menu shows, because it's only there to be read. */
function menuForToday() {
  if (!isOrderingOpen()) return menu;

  const today = new Date();
  if (isSpecialDay(today)) return menu.filter((item) => item.special);
  return menu.filter((item) => item.days.includes(today.getDay()));
}

function renderDealBanner() {
  document.getElementById("deal-banner").innerHTML =
    '<span class="deal-main">' + settings.bundleQty + " X $" + settings.bundlePrice.toFixed(0) + "</span>" +
    '<span class="deal-sub">' + bi("dealSub", { qty: settings.bundleQty }) + "</span>";
}

/* Everything in the cart, on the board or not. Whether the kitchen can
   still make it is asked separately, so nothing disappears by itself. */
function cartLines() {
  return Object.keys(cart)
    .filter((id) => cart[id] > 0)
    .map((id) => {
      const live = menu.find((item) => item.id === id);
      const name = live || cartNames[id] || { es: id, en: "" };
      return { id: id, es: name.es, en: name.en, qty: cart[id] };
    });
}

function cartCount() {
  return cartLines().reduce((sum, line) => sum + line.qty, 0);
}

/* Just sold out — still good. When you tap Agotado, anything already
   sitting in a cart keeps working for graceSeconds, so a customer who
   was mid-order doesn't lose it. Nobody new can add it: the board takes
   its buttons away the moment you tap.

   Both ends read the database's clock, so a phone with the wrong time
   set still gets exactly the minute you set. */
function inGracePeriod(item) {
  if (!item || !item.soldOut || !item.soldOutAt) return false;

  const soldAt = new Date(item.soldOutAt).getTime();
  if (isNaN(soldAt)) return false;

  return serverTime() - soldAt < settings.graceSeconds * 1000;
}

/* Cart lines the kitchen can't make any more: sold out, deleted, or
   not offered on today's menu */
function unavailableLines() {
  const board = menuForToday();
  return cartLines().filter((line) => {
    const onBoard = board.find((item) => item.id === line.id);
    if (!onBoard) return true;                       // gone from the menu
    return onBoard.soldOut && !inGracePeriod(onBoard);
  });
}

function dropFromCart(itemId) {
  delete cart[itemId];
  delete cartNames[itemId];
  renderMenu();
  syncSlotLock();
}

function changeQty(itemId, delta) {
  const current = cart[itemId] || 0;
  const next = Math.min(MAX_PER_ITEM, Math.max(0, current + delta));

  if (next === 0) {
    delete cart[itemId];
    delete cartNames[itemId];
  } else {
    cart[itemId] = next;
    const item = menu.find((one) => one.id === itemId);
    if (item) cartNames[itemId] = { es: item.es, en: item.en };
  }

  renderMenu();
  syncSlotLock();
}

/* Keeps the times in step with the cart.
   A time that's already been picked stays picked and the countdown keeps
   running — going back to add more pupusas must never cost the customer
   their window. Only the times they haven't picked go locked. */
function syncSlotLock() {
  renderSlots();
}

function renderMenu() {
  const list = document.getElementById("menu-list");
  list.innerHTML = "";

  const todaysMenu = menuForToday();

  if (todaysMenu.length === 0) {
    list.innerHTML = '<p class="empty-state">' +
      (menu.length === 0 ? bi("menuUpdating") : bi("noneToday")) + "</p>";
    renderGoneLines(list);
    renderCartStrip();
    return;
  }

  // On a closed day the menu is just a menu — nothing to tap
  const canOrder = isOrderingOpen();

  todaysMenu.forEach((item) => {
    const qty = cart[item.id] || 0;

    const row = document.createElement("div");
    row.className = "menu-item"
      + (item.soldOut ? " soldout" : "")
      + (canOrder && !item.soldOut && qty > 0 ? " active" : "");

    const dot = document.createElement("span");
    dot.className = "menu-dot";

    const info = document.createElement("div");
    info.className = "menu-info";
    info.innerHTML = '<p class="menu-name">' + biPair(item.es, item.en) + "</p>";

    row.append(dot, info);

    if (item.soldOut) {
      const flag = document.createElement("span");
      flag.className = "sold-flag";
      flag.innerHTML = bi("soldOut");
      row.appendChild(flag);
    } else if (canOrder) {
      const stepper = document.createElement("div");
      stepper.className = "stepper";

      const minus = document.createElement("button");
      minus.className = "step-btn";
      minus.textContent = "−";
      minus.disabled = qty === 0;
      minus.setAttribute("aria-label", "−1 " + item.es);
      minus.onclick = () => changeQty(item.id, -1);

      const count = document.createElement("span");
      count.className = "qty" + (qty === 0 ? " zero" : "");
      count.textContent = qty;

      const plus = document.createElement("button");
      plus.className = "step-btn plus";
      plus.textContent = "+";
      plus.disabled = qty >= MAX_PER_ITEM;
      plus.setAttribute("aria-label", "+1 " + item.es);
      plus.onclick = () => changeQty(item.id, 1);

      stepper.append(minus, count, plus);
      row.appendChild(stepper);
    }

    list.appendChild(row);
  });

  renderGoneLines(list);
  renderCartStrip();
}

/* A pupusa that sold out while it was already in someone's cart. It
   stays on the board, named, with a × to take it out — the customer
   decides what happens to their own order, not the refresh. */
function renderGoneLines(list) {
  unavailableLines().forEach((line) => {
    const row = document.createElement("div");
    row.className = "menu-item gone";

    const dot = document.createElement("span");
    dot.className = "menu-dot";

    const info = document.createElement("div");
    info.className = "menu-info";
    info.innerHTML = '<p class="menu-name">' + line.qty + "× " + biPair(line.es, line.en) + "</p>" +
                     '<p class="gone-flag">' + bi("justGone") + "</p>";

    const remove = document.createElement("button");
    remove.className = "step-btn remove-gone";
    remove.textContent = "×";
    remove.setAttribute("aria-label", fill(T.dropIt.es, { name: line.es }));
    remove.onclick = () => dropFromCart(line.id);

    row.append(dot, info, remove);
    list.appendChild(row);
  });
}

function renderCartStrip() {
  const strip = document.getElementById("cart-strip");
  const nudge = document.getElementById("deal-nudge");
  const count = cartCount();

  // Closed day: no running total, because nothing can be ordered
  if (!isOrderingOpen()) {
    strip.style.display = "none";
    nudge.textContent = "";
    return;
  }
  strip.style.display = "flex";

  if (count === 0) {
    strip.className = "cart-strip empty";
    strip.innerHTML = "<span>" + bi("noneYet") + "</span><span>—</span>";
    nudge.textContent = "";
    return;
  }

  const missing = missingForSet(count);

  // Strip turns red until the order is a full set of 3
  strip.className = "cart-strip" + (missing > 0 ? " incomplete" : "");
  strip.innerHTML =
    "<span>" + count + " pupusas</span>" +
    '<span class="right"><span class="money">' + money(priceFor(count)) + "</span>" +
    '<span class="pay">' + biText("payAtPickup") + "</span></span>";

  nudge.innerHTML = missing === 0 ? "" : bi("nudge", { n: missing, qty: settings.bundleQty });
}


/* ============================================================
   TIME SLOTS
   ============================================================ */
/* A window holds a set number of pickups, not a set number of tickets.
   A mom and her son splitting the bill on one phone number are still one
   person walking up at 10:00, so their two tickets take one spot between
   them. A different phone number is a different pickup. */
function phonesInSlot(iso) {
  const phones = new Set();
  orders.forEach((order) => {
    if (order.slot === iso) phones.add(phoneDigits(order.phone));
  });
  return phones;
}

function ordersInSlot(iso) {
  return orders.filter((order) => order.slot === iso).length;
}

/* How many parties hold a window. The database is the real answer,
   but an order just placed on this phone may not be counted there
   yet, so whichever number is higher wins. */
function partiesInSlot(iso) {
  const remote = slotCounts[iso] || 0;
  return Math.max(remote, phonesInSlot(iso).size);
}

/* Whatever phone is typed into the form right now */
function currentPhone() {
  const field = document.getElementById("customer-phone");
  return field ? phoneDigits(field.value) : "";
}

/* A window is open to this phone if there's a free spot, or if this
   phone already holds a spot in it and is just adding another ticket */
function slotHasRoom(iso, phone) {
  const digits = phone === undefined ? currentPhone() : phoneDigits(phone);

  // Already holding this window on this phone — just adding another ticket
  if (digits.length === 10 && phonesInSlot(iso).has(digits)) return true;
  return partiesInSlot(iso) < settings.ordersPerSlot;
}

function spotsLeft(iso) {
  return Math.max(0, settings.ordersPerSlot - partiesInSlot(iso));
}

function isSlotFull(iso, phone) { return !slotHasRoom(iso, phone); }

function generateTimeSlots() {
  const now = new Date();

  // Closed day: no times at all, so there is nothing to book
  if (!isOrderingOpen(now)) return [];

  const span = hoursFor(now);

  // Start at the next clean boundary, but never before the doors open
  const start = new Date(now);
  start.setSeconds(0, 0);
  const remainder = start.getMinutes() % settings.slotMinutes;
  if (remainder !== 0) start.setMinutes(start.getMinutes() + (settings.slotMinutes - remainder));
  if (start < span.open) start.setTime(span.open.getTime());

  const special = isSpecialDay(now);

  // A surprise day gets a fixed batch of windows. A regular day gets
  // whatever fits in the booking window. Either way, closing time wins.
  const maxSlots = special ? settings.specialSlots : Infinity;
  const stopAt = special
    ? span.close
    : new Date(Math.min(now.getTime() + settings.windowHours * 60 * 60 * 1000,
                        span.close.getTime()));

  const slots = [];
  const cursor = new Date(start);
  while (cursor < stopAt && slots.length < maxSlots) {
    slots.push({ time: formatTime(cursor), iso: toLocalIso(cursor) });
    cursor.setMinutes(cursor.getMinutes() + settings.slotMinutes);
  }
  return slots;
}

function renderSlots() {
  const slotList = document.getElementById("slot-list");
  slotList.innerHTML = "";

  const hint = document.getElementById("slot-hint");
  const special = isSpecialDay();

  // The hint under the heading changes with the kind of day
  if (!isOrderingOpen()) {
    hint.innerHTML = "";
  } else if (special) {
    hint.innerHTML = bi("specialHint", {
      n: settings.specialSlots,
      min: settings.slotMinutes,
      orders: settings.ordersPerSlot
    });
  } else {
    hint.innerHTML = bi("slotHint", {
      min: settings.slotMinutes,
      h: settings.windowHours,
      orders: settings.ordersPerSlot
    });
  }

  const slots = generateTimeSlots();

  // A time can only be picked once the cart is a full set of 3, and
  // only if everything in it can still be made. Until then the buttons
  // are shown but shut, with a note saying why.
  const count = cartCount();
  const stranded = unavailableLines().length > 0;
  const setReady = isCompleteOrder(count) && !stranded;
  const lockNote = document.getElementById("slot-lock");

  if (isOrderingOpen() && slots.length > 0 && !setReady) {
    if (stranded) {
      // Their held time is untouched — this is only about the cart
      lockNote.innerHTML = bi("fixCart");
    } else if (selectedSlotIso) {
      // They already hold a time — say so, so nobody panics and re-picks.
      // An empty cart needs its own line, since "add 0 more" reads as nonsense.
      lockNote.innerHTML = count === 0
        ? bi("lockHeldEmpty")
        : bi("lockHeld", { qty: settings.bundleQty, n: missingForSet(count) });
    } else {
      lockNote.innerHTML = count === 0
        ? bi("lockPick")
        : bi("lockSet", { qty: settings.bundleQty, n: missingForSet(count) });
    }
    lockNote.style.display = "block";
  } else {
    lockNote.style.display = "none";
  }

  if (slots.length === 0) {
    let message;

    if (!isOrderingOpen()) {
      message = bi("closedSlots");                       // wrong day entirely
    } else if (hoursState() === "before") {
      message = bi("beforeOpen", { time: prettyTime(settings.openTime) });
    } else if (hoursState() === "after") {
      message = bi("afterClose", { time: prettyTime(settings.openTime) });
    } else {
      message = bi("closed");                            // too close to closing
    }

    slotList.innerHTML = '<p class="empty-state">' + message + "</p>";
    return;
  }

  slots.forEach((slot) => {
    const parts = splitTime(new Date(slot.iso));
    const left = spotsLeft(slot.iso);
    const heldByMe = slot.iso === selectedSlotIso;

    // Full to everyone else, but still open to a phone that's already
    // in this window and is only adding a second ticket
    const openToMe = slotHasRoom(slot.iso);
    const myWindow = openToMe && left === 0;

    let state;
    if (myWindow) state = bi("yourWindow");
    else if (left === 0) state = bi("full");
    else state = bi("left", { n: left });

    const button = document.createElement("button");
    button.className = "slot-button";
    button.innerHTML =
      '<span class="slot-time">' + parts.clock +
      ' <span class="slot-meridiem">' + parts.meridiem + "</span></span>" +
      '<span class="' + (left === 1 ? "slot-state low" : "slot-state") + '">' +
      state + "</span>";

    if (heldByMe) {
      // The held time stays lit and stays theirs, whatever the cart is doing
      button.classList.add("selected");
      button.onclick = () => selectSlot(slot);
    } else if (!openToMe) {
      button.classList.add("booked");
      button.disabled = true;
    } else if (!setReady) {
      button.classList.add("locked");
      button.disabled = true;
    } else {
      button.onclick = () => selectSlot(slot);
    }

    slotList.appendChild(button);
  });
}

/* ============================================================
   SLOT HOLD
   Picking a time starts a countdown. If the customer wanders off
   without finishing, the time is let go instead of sitting reserved.
   ============================================================ */
let holdTimer = null;    // the ticking interval
let holdEndsAt = 0;      // when this hold runs out

/* 275 seconds -> "4:35" */
function countdownText(totalSeconds) {
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return minutes + ":" + String(seconds).padStart(2, "0");
}

function startHold() {
  holdEndsAt = Date.now() + settings.holdMinutes * 60 * 1000;
  clearInterval(holdTimer);
  holdTimer = setInterval(tickHold, 1000);
  tickHold();
}

function stopHold() {
  clearInterval(holdTimer);
  holdTimer = null;
  holdEndsAt = 0;
  document.getElementById("hold-timer").style.display = "none";
}

function tickHold() {
  const secondsLeft = Math.max(0, Math.ceil((holdEndsAt - Date.now()) / 1000));
  const box = document.getElementById("hold-timer");

  box.style.display = "block";
  box.className = "hold-timer" + (secondsLeft <= 60 ? " urgent" : "");
  box.innerHTML = bi("holding", { clock: countdownText(secondsLeft) });

  if (secondsLeft <= 0) releaseHold();
}

/* Time's up: let the slot go and send the customer back to the times */
function releaseHold() {
  // Grab the time before clearing it, so the notice can name it
  const lostTime = selectedSlotIso ? formatTime(new Date(selectedSlotIso)) : "";

  stopHold();
  selectedSlotIso = null;

  document.getElementById("order-form").style.display = "none";
  hideFormError();

  const note = document.getElementById("hold-note");
  note.className = "hold-note expired";
  note.innerHTML = bi("holdOut", { time: lostTime });
  note.style.display = "block";

  renderSlots();
  note.scrollIntoView({ behavior: "smooth", block: "center" });
}


function selectSlot(slot) {
  // Backstop: new times are only pickable with a full set in the cart.
  // Re-tapping the time they already hold is always allowed — it just
  // restarts the countdown for them.
  if (!isCompleteOrder(cartCount()) && slot.iso !== selectedSlotIso) return;

  selectedSlotIso = slot.iso;

  const note = document.getElementById("hold-note");
  note.className = "hold-note";
  note.style.display = "none";
  document.getElementById("selected-slot-label").innerHTML = bi("pickupAt", { time: slot.time });
  document.getElementById("order-form").style.display = "block";
  hideConfirmation();
  hideFormError();

  startHold();
  renderSlots();
  revealForm();
}

/* ============================================================
   KEYBOARD ROOM
   On a phone the keyboard slides up over the bottom half of the
   screen. The form sits below the times, so without this the name
   box opens underneath the keyboard and can't be seen.
   ============================================================ */

/* Pull the form to the top of the screen, leaving the most room possible */
function scrollFormIntoView() {
  const form = document.getElementById("order-form");
  const top = form.getBoundingClientRect().top + window.scrollY - 12;
  window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
}

function revealForm() {
  const nameField = document.getElementById("customer-name");

  // Focus inside the tap itself — phones only open the keyboard for
  // focus that comes straight from a real touch. preventScroll stops
  // the browser's own jump so our scroll is the one that lands.
  nameField.focus({ preventScroll: true });

  scrollFormIntoView();

  // Run it again once the keyboard has finished sliding in, since the
  // visible area is smaller by then
  setTimeout(scrollFormIntoView, 350);
}

/* Fields that sit above an on-screen keyboard and must stay visible */
const KEYBOARD_FIELDS = ["customer-name", "customer-phone", "owner-passcode"];

/* If a field still ends up under the keyboard, nudge it back up */
function keepFieldVisible() {
  const field = document.activeElement;
  if (!field || KEYBOARD_FIELDS.indexOf(field.id) === -1) return;

  const visibleBottom = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  const box = field.getBoundingClientRect();

  if (box.bottom > visibleBottom - 16) {
    window.scrollBy({ top: box.bottom - visibleBottom + 24, behavior: "smooth" });
  }
}

if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", keepFieldVisible);
}

// Tapping "Next" moves to the phone box, which sits lower — check that one too
KEYBOARD_FIELDS.forEach((id) => {
  document.getElementById(id).addEventListener("focus", () => {
    setTimeout(keepFieldVisible, 300);
  });
});

function showFormError(key, vars) {
  const box = document.getElementById("form-error");
  box.innerHTML = bi(key, vars);
  box.style.display = "block";
}

function hideFormError() { document.getElementById("form-error").style.display = "none"; }


/* ============================================================
   CREATING AN ORDER
   ============================================================ */
/* The rail keeps this many tickets. Past that, the oldest handed-off
   ones drop off the end — anything still pending is never touched, no
   matter how old it is. */
const MAX_ORDERS = 1000;

/* When an order happened. Older saves have no stamp, so the pickup
   time stands in for them. */
function orderStamp(order) {
  return new Date(order.placedAt || order.slot).getTime();
}

function trimHistory() {
  if (orders.length <= MAX_ORDERS) return;

  const oldestFirst = orders
    .filter((order) => order.status === "completed")
    .sort((a, b) => orderStamp(a) - orderStamp(b));

  const dropping = new Set();
  let excess = orders.length - MAX_ORDERS;

  oldestFirst.forEach((order) => {
    if (excess > 0) { dropping.add(order.id); excess--; }
  });

  if (dropping.size > 0) orders = orders.filter((order) => !dropping.has(order.id));
}

/* The order is only real once the database has it. If that fails
   nothing is kept, so nobody walks away holding a ticket the
   kitchen never received. */
async function createOrder(name, phone, slotIso, items, total) {
  const order = {
    id: makeId(), name: name, phone: phone, slot: slotIso,
    items: items, total: total, status: "pending",
    placedAt: new Date(serverTime()).toISOString()
  };

  if (db) {
    const accepted = await pushOrder(order);
    if (!accepted) return null;
  }

  // Kept on this phone too, so the customer's own windows stay open to them
  orders.push(order);
  trimHistory();
  saveAll();
  fetchSlotCounts().then(renderSlots);
  return order;
}

document.getElementById("customer-phone").oninput = (event) => {
  event.target.value = formatPhone(event.target.value);
};

/* The name goes up in caps as it's typed, whatever the keyboard is doing.
   The CSS only changed how it looked; this changes the value itself, so
   caps lock, autocorrect and paste all end up the same way. The caret is
   put back where it was, otherwise it would jump to the end mid-edit. */
document.getElementById("customer-name").oninput = (event) => {
  const field = event.target;
  const upper = field.value.toUpperCase();

  if (upper !== field.value) {
    const caretStart = field.selectionStart;
    const caretEnd = field.selectionEnd;
    field.value = upper;
    field.setSelectionRange(caretStart, caretEnd);
  }
};

let sendingOrder = false;

document.getElementById("submit-order").onclick = async () => {
  const nameInput = document.getElementById("customer-name");
  const phoneInput = document.getElementById("customer-phone");
  // Saved in caps too — the CSS only changes how it looks on screen,
  // so without this the ticket and dashboard would show it mixed case
  const name = nameInput.value.trim().toUpperCase();
  const phone = formatPhone(phoneInput.value);
  const items = cartLines();
  const count = cartCount();

  // Last line of defence: the day may have rolled over since the page loaded
  if (!isOrderingOpen()) {
    stopHold();
    selectedSlotIso = null;
    document.getElementById("order-form").style.display = "none";
    renderDayNotice();
    renderMenu();
    renderSlots();
    document.getElementById("day-notice").scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }

  if (count === 0) {
    showFormError("errItems", { qty: settings.bundleQty });
    document.getElementById("menu-list").scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  // Orders must be a full set: 3, 6, 9...
  if (!isCompleteOrder(count)) {
    showFormError("errSets", { qty: settings.bundleQty, n: missingForSet(count) });
    document.getElementById("menu-list").scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  // Something in the cart sold out while they were filling this in
  if (unavailableLines().length > 0) {
    showFormError("fixCart");
    renderMenu();
    document.getElementById("menu-list").scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  if (name === "") {
    showFormError("errName");
    nameInput.focus();
    return;
  }
  if (phoneDigits(phone).length !== 10) {
    showFormError("errPhone");
    phoneInput.focus();
    return;
  }
  // The chosen time must still be on offer — it may have passed,
  // filled up, or slipped past closing while the form sat open
  const stillOffered = generateTimeSlots().some((slot) => slot.iso === selectedSlotIso);
  if (!selectedSlotIso || !stillOffered || isSlotFull(selectedSlotIso, phone)) {
    stopHold();
    showFormError("errFull");
    selectedSlotIso = null;
    renderSlots();
    return;
  }

  // The window may have filled while this form sat open
  await fetchSlotCounts();
  if (isSlotFull(selectedSlotIso, phone)) {
    showFormError("slotTaken");
    stopHold();
    selectedSlotIso = null;
    renderSlots();
    return;
  }

  // One tap only, and say what is happening while the order flies up
  if (sendingOrder) return;
  sendingOrder = true;

  const button = document.getElementById("submit-order");
  const buttonWas = button.innerHTML;
  button.disabled = true;
  button.innerHTML = bi("sending");

  const order = await createOrder(name, phone, selectedSlotIso, items, priceFor(count));

  sendingOrder = false;
  button.disabled = false;
  button.innerHTML = buttonWas;

  if (!order) {
    showFormError("sendFailed");
    return;
  }

  showConfirmation(order);

  stopHold();
  nameInput.value = "";
  phoneInput.value = "";
  cart = {};
  cartNames = {};
  selectedSlotIso = null;
  document.getElementById("order-form").style.display = "none";
  hideFormError();
  renderMenu();
  renderSlots();
};

/* ============================================================
   SAVED RECEIPT
   Instead of a texting service, the customer keeps a picture of the
   order and the kitchen phones them when the bags are up.

   It's drawn on a canvas rather than screenshotted, so it comes out
   the same on every phone, and it's an image rather than a PDF so it
   lands in the photo roll where people actually look.
   ============================================================ */
const RECEIPT = {
  width: 620,          // drawn at 2× below, so it stays sharp when zoomed
  pad: 34,
  ink: "#2B1A0F", paper: "#FFFFFF", blue: "#0F47AF",
  muted: "#7A6551", line: "#E8D9BE"
};

/* One pass measures, the next draws — same code both times, so the
   canvas is never the wrong height for its contents. */
function paintReceipt(ctx, order, party) {
  const R = RECEIPT;
  const left = R.pad;
  const right = R.width - R.pad;
  let y = R.pad;

  const write = (text, font, color, align) => {
    ctx.font = font;
    ctx.fillStyle = color;
    ctx.textAlign = align || "left";
    ctx.fillText(text, align === "right" ? right : left, y);
  };

  const rule = () => {
    ctx.strokeStyle = R.line;
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(left, y);
    ctx.lineTo(right, y);
    ctx.stroke();
    ctx.setLineDash([]);
  };

  y += 22;
  write(settings.shopName.toUpperCase(), '700 21px "Bricolage Grotesque", sans-serif', R.ink);

  y += 26;
  write("RECOGER / PICKUP", '400 12px "DM Mono", monospace', R.muted);

  y += 48;
  write(formatTime(new Date(order.slot)), '500 42px "DM Mono", monospace', R.ink);

  y += 26; rule();

  y += 26;
  write(T.ticket.es + " / " + T.ticket.en, '400 12px "DM Mono", monospace', R.muted);

  y += 30;
  write("#" + partyCode(partyKeyOf(order)), '500 24px "DM Mono", monospace', R.blue);

  y += 30;
  write(order.name.toUpperCase(), '700 17px "DM Sans", sans-serif', R.ink);

  y += 24;
  write(order.phone, '400 16px "DM Mono", monospace', R.ink);

  y += 22; rule();

  party.forEach((one) => {
    y += 28;
    write(ticketNumber(one), '500 14px "DM Mono", monospace', R.blue);
    write(money(one.total), '500 14px "DM Mono", monospace', R.ink, "right");

    one.items.forEach((item) => {
      y += 24;
      write(item.qty + "×  " + item.es, '400 16px "DM Sans", sans-serif', R.ink);
    });
    y += 10;
  });

  y += 8; rule();

  y += 34;
  write("TOTAL", '400 13px "DM Mono", monospace', R.muted);
  write(money(party.reduce((sum, one) => sum + one.total, 0)),
        '500 22px "DM Mono", monospace', R.ink, "right");

  y += 26; rule();

  y += 30;
  write(T.willCall.es, '500 15px "DM Sans", sans-serif', R.ink);
  y += 20;
  write(T.willCall.en, '400 13px "DM Sans", sans-serif', R.muted);

  return y + R.pad;
}

async function receiptBlob(order, party) {
  // Web fonts have to be in before the first stroke or it draws in Arial
  if (document.fonts && document.fonts.ready) await document.fonts.ready;

  const scale = 2;
  const measure = document.createElement("canvas").getContext("2d");
  const height = paintReceipt(measure, order, party);

  const canvas = document.createElement("canvas");
  canvas.width = RECEIPT.width * scale;
  canvas.height = height * scale;

  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  ctx.fillStyle = RECEIPT.paper;
  ctx.fillRect(0, 0, RECEIPT.width, height);
  paintReceipt(ctx, order, party);

  return new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
}

/* The image is drawn the moment the stub opens, not when the button is
   pressed. A browser only honours a download while the tap that asked
   for it is still live, and awaiting the canvas burns straight through
   that window — which is why the button quietly did nothing. By the
   time a thumb reaches it the file is already sitting in memory, so
   the click handler runs start to finish inside the tap. */
let readyReceipt = null;

function prepareReceipt(order) {
  const pending = { id: order.id, blob: null, url: "" };
  readyReceipt = pending;

  receiptBlob(order, partyMembers(order))
    .then((blob) => { if (readyReceipt === pending) pending.blob = blob; })
    .catch(() => { /* the fallback link covers a failed draw */ });
}

function releaseReceipt() {
  if (readyReceipt && readyReceipt.url) URL.revokeObjectURL(readyReceipt.url);
  readyReceipt = null;
}

function deliverReceipt(blob, filename) {
  const url = URL.createObjectURL(blob);
  if (readyReceipt) readyReceipt.url = url;

  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();

  // Some Android builds cancel the download if the anchor vanishes on
  // the same tick it was clicked
  setTimeout(() => link.remove(), 4000);

  /* Whatever the browser decided to do with that, there's now a real
     link to the image. Open it, hold the picture, save it — that path
     works everywhere, and it's there rather than leaving anyone
     tapping a button that looks broken. */
  const escape = document.getElementById("open-receipt");
  if (escape) {
    escape.href = url;
    escape.style.display = "block";
  }
}

/* Saving on a phone isn't a download. iOS ignores a download link and
   simply opens the picture, so the only road into the photo roll is the
   share sheet — and that only opens while the tap that asked for it is
   still live, which is why the drawing is done in advance. */
async function saveReceipt(order) {
  const filename = "pedido-" + partyCode(partyKeyOf(order)) + ".png";
  const byFinger = window.matchMedia("(pointer: coarse)").matches;

  let blob = (readyReceipt && readyReceipt.id === order.id) ? readyReceipt.blob : null;

  // Already drawn: hand it to the phone without awaiting anything first,
  // so the tap is still good when the share sheet asks for it
  if (blob && navigator.canShare) {
    const file = new File([blob], filename, { type: "image/png" });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; }
      catch (error) {
        if (error && error.name === "AbortError") return;   // they backed out
        // blocked — show the picture instead
      }
    }
  }

  // Tapped before the drawing finished. Rare, but say what's happening
  // rather than leaving a button that looks dead.
  if (!blob) {
    const button = document.getElementById("save-order");
    const label = button ? button.innerHTML : "";
    if (button) { button.disabled = true; button.innerHTML = bi("buildingReceipt"); }

    blob = await receiptBlob(order, partyMembers(order)).catch(() => null);

    if (button) { button.disabled = false; button.innerHTML = label; }
    if (!blob) return;
    if (readyReceipt && readyReceipt.id === order.id) readyReceipt.blob = blob;
  }

  // A finger can't download anything. Put the picture on screen and say
  // how to keep it — pressing and holding works on every phone.
  if (byFinger) { showReceiptImage(blob); return; }

  deliverReceipt(blob, filename);
}

/* The receipt, full width, with the one instruction that actually saves
   it. It stays up until they close it, because the picture has to be on
   screen long enough to be pressed. */
function showReceiptImage(blob) {
  const url = URL.createObjectURL(blob);

  const layer = document.createElement("div");
  layer.className = "stub-overlay receipt-layer";
  layer.innerHTML =
    '<div class="receipt-card">' +
      '<p class="receipt-hint">' + bi("holdToSave") + "</p>" +
      '<img src="' + url + '" alt="' + escapeHtml(biText("receiptTitle")) + '">' +
      '<button class="stub-close">' + bi("closeReceipt") + "</button>" +
    "</div>";

  layer.querySelector("button").onclick = () => {
    layer.remove();
    URL.revokeObjectURL(url);
  };

  document.body.appendChild(layer);
}

function showConfirmation(order) {
  const parts = splitTime(new Date(order.slot));
  const box = document.getElementById("order-confirmation");

  const lines = (one) => one.items.map((line) =>
    '<div class="stub-row"><span>' + line.qty + "×</span><span>" +
    biPair(line.es, line.en) + "</span></div>"
  ).join("");

  /* Everything they're picking up at this window, not just the order
     they finished a second ago. Four orders at 3:00 is four bags but
     one trip, so it's one card with every bag on it and one code at
     the bottom that covers the lot. */
  const party = partyMembers(order);
  const total = party.reduce((sum, one) => sum + one.total, 0);

  const itemRows = party.length < 2 ? lines(order) :
    '<p class="stub-bags-head">' + bi("bagsCount", { n: party.length }) + "</p>" +
    party.map((one) =>
      '<div class="stub-bag">' +
        '<div class="stub-bag-head">' +
          "<span>" + ticketNumber(one) + "</span>" +
          "<span>" + money(one.total) + "</span>" +
        "</div>" + lines(one) +
      "</div>"
    ).join("");

  box.className = "stub-overlay";
  box.innerHTML =
    '<div class="stub">' +
    '<p class="eyebrow">' + bi("placed") + "</p>" +
    '<p class="stub-head">' + bi("seeYou", { name: order.name.split(" ")[0] }) + "</p>" +
    '<span class="stub-time">' + parts.clock +
    ' <span class="slot-meridiem">' + parts.meridiem + "</span></span>" +
    '<div class="stub-divider"></div>' +
    itemRows +
    '<div class="stub-row total"><span>' + biText("total") + "</span><span>" + money(total) + "</span></div>" +
    '<div class="stub-row"><span>' + biText("phone") + "</span><span>" + escapeHtml(order.phone) + "</span></div>" +
    '<div class="stub-row"><span>' + biText("ticket") + "</span><span>" +
      "#" + partyCode(partyKeyOf(order)) + "</span></div>" +
    '<p class="stub-callout">' + bi("willCall") + "</p>" +
    '<div class="stub-actions">' +
    '<button class="ghost-button" id="save-order">' + bi("saveReceipt") + "</button>" +
    '<a class="stub-fallback" id="open-receipt" target="_blank" rel="noopener">' +
      bi("openImage") + "</a>" +
    '<button class="ghost-button" id="new-order">' + bi("another") + "</button>" +
    '<button class="stub-close" id="close-order">' + bi("closeOrder") + "</button>" +
    "</div></div>";

  box.style.display = "flex";
  lockPage();
  prepareReceipt(order);

  document.getElementById("save-order").onclick = () => saveReceipt(order);

  document.getElementById("new-order").onclick = () => {
    hideConfirmation();
    startAnotherOrder(order);
  };

  document.getElementById("close-order").onclick = () => {
    hideConfirmation();
    renderSlots();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
}

/* ============================================================
   PAGE FREEZE
   Pinning the body is the only lock every phone honours, but a pinned
   body forgets where it was scrolled to. So the position is stashed on
   the way in and put back on the way out — otherwise closing the stub
   would fling the customer to the top of the page.
   ============================================================ */
let pageLocked = false;
let lockedScrollY = 0;

function lockPage() {
  if (pageLocked) return;

  lockedScrollY = window.scrollY;
  document.body.style.top = -lockedScrollY + "px";
  document.body.classList.add("stub-open");
  pageLocked = true;
}

function unlockPage() {
  if (!pageLocked) return;

  document.body.classList.remove("stub-open");
  document.body.style.top = "";
  pageLocked = false;

  // Instant, not smooth — this is putting them back where they were,
  // not taking them somewhere
  window.scrollTo(0, lockedScrollY);
}

/* Puts the stub away and gives the page back its scroll */
function hideConfirmation() {
  document.getElementById("order-confirmation").style.display = "none";
  releaseReceipt();
  unlockPage();
}

/* ============================================================
   SECOND ORDER, SAME PERSON
   Ordering again for the same pickup keeps their name, phone and
   window — separate tickets, because separate orders get bagged and
   handed off separately. Only the pupusas start over.
   ============================================================ */
function startAnotherOrder(previous) {
  document.getElementById("customer-name").value = previous.name;
  document.getElementById("customer-phone").value = previous.phone;

  const note = document.getElementById("hold-note");
  note.className = "hold-note";
  note.style.display = "none";

  // Their window may have taken its last order while they were checking out
  const stillOffered = generateTimeSlots().some((slot) => slot.iso === previous.slot);
  const roomLeft = stillOffered && !isSlotFull(previous.slot, previous.phone);

  if (roomLeft) {
    selectedSlotIso = previous.slot;
    document.getElementById("selected-slot-label").innerHTML =
      bi("pickupAt", { time: formatTime(new Date(previous.slot)) });
    document.getElementById("order-form").style.display = "block";
    startHold();
  } else {
    note.innerHTML = bi("againFull");
    note.style.display = "block";
  }

  renderSlots();
  document.getElementById("menu-list").scrollIntoView({ behavior: "smooth", block: "start" });
}


/* ============================================================
   OWNER — TICKET RAIL
   ============================================================ */
let railView = "active";        // "active" or "history"
let historyShown = 60;          // rows rendered so far, grown by the button

function activeOrders() { return orders.filter((o) => o.status === "pending"); }
function pastOrders() { return orders.filter((o) => o.status === "completed"); }

function showRail(which) {
  railView = which;
  if (which === "active") historyShown = 60;   // history starts fresh each visit

  document.getElementById("tab-active").classList.toggle("on", which === "active");
  document.getElementById("tab-history").classList.toggle("on", which === "history");
  document.getElementById("order-list").style.display = which === "active" ? "grid" : "none";
  document.getElementById("history-list").style.display = which === "history" ? "block" : "none";

  renderOrders();
}

function renderOrders() {
  renderTabLabels();
  if (railView === "history") { renderHistory(); return; }

  renderActiveRail();
}

function renderTabLabels() {
  document.getElementById("tab-active").innerHTML = bi("tabActive", { n: activeOrders().length });
  document.getElementById("tab-history").innerHTML = bi("tabHistory", { n: pastOrders().length });
}

function renderActiveRail() {
  const list = document.getElementById("order-list");
  list.innerHTML = "";

  const waiting = activeOrders();
  document.getElementById("pending-count").innerHTML = bi("pending", { n: waiting.length });

  if (waiting.length === 0) {
    list.innerHTML = '<div class="rail-empty">' + bi("noOrders") + "</div>";
    return;
  }

  /* Tickets sharing a window and a phone number are one pickup — a family
     splitting the bill. They share a ticket code, sit next to each other
     on the rail, and each carries a flag saying how many bags belong to
     that person. Parties are counted across every ticket, handed off or
     not, so "1 de 3" keeps meaning the same thing as bags go out. */
  const sorted = waiting.slice().sort((a, b) =>
    a.slot.localeCompare(b.slot) ||
    phoneDigits(a.phone).localeCompare(phoneDigits(b.phone)) ||
    String(a.placedAt || "").localeCompare(String(b.placedAt || "")) ||
    String(a.id).localeCompare(String(b.id))
  );

  sorted.forEach((order) => {
    const parts = splitTime(new Date(order.slot));
    const done = order.status === "completed";

    const party = partyMembers(order);
    const shared = party.length > 1;

    const itemRows = order.items.map((line) =>
      '<li><span class="ticket-qty">' + line.qty + "×</span><span>" +
      biPair(line.es, line.en) + "</span></li>"
    ).join("");

    const ticket = document.createElement("div");
    ticket.className = "ticket" + (done ? " completed" : "") + (shared ? " grouped" : "");

    let partyFlag = "";
    if (shared) {
      const position = party.findIndex((o) => o.id === order.id) + 1;

      // Counts this ticket too — what matters at the window is how many
      // bags are still on the shelf for this person, not how many besides
      // the one being looked at
      const stillOut = party.filter((o) => o.status === "pending").length;

      partyFlag =
        '<div class="party-flag">' +
          bi("together", { i: position, n: party.length }) +
          '<span class="party-left">' +
            (stillOut === 1 ? bi("lastOfGroup") : bi("stillOut", { n: stillOut })) +
          "</span>" +
        "</div>";
    }

    ticket.innerHTML =
      '<span class="status ' + order.status + '">' +
        (done ? bi("statusDone") : bi("statusPending")) + "</span>" +
      '<span class="ticket-label">' + escapeHtml(biText("ticket")) + "</span>" +
      '<span class="ticket-number">' + ticketNumber(order) + "</span>" +
      '<span class="ticket-time">' + parts.clock +
      ' <span class="ticket-meridiem">' + parts.meridiem + "</span></span>" +
      '<div class="ticket-rule"></div>' +
      '<ul class="ticket-items">' + itemRows + "</ul>" +
      '<div class="ticket-total"><span>' + biText("total") + "</span><span>" + money(order.total) + "</span></div>" +
      '<div class="ticket-who">' +
        '<p class="ticket-name">' + escapeHtml(order.name) + "</p>" +
        '<a class="ticket-phone" href="tel:' + phoneDigits(order.phone) + '">' +
          escapeHtml(order.phone) + "</a>" +
      "</div>" +
      partyFlag;

    if (done) {
      const mark = document.createElement("p");
      mark.className = "done-mark";
      mark.innerHTML = bi("handedOff");
      ticket.appendChild(mark);
    } else {
      const button = document.createElement("button");
      button.className = "complete-button";
      button.innerHTML = bi("markDone");
      button.onclick = () => markComplete(order.id);
      ticket.appendChild(button);
    }

    list.appendChild(ticket);
  });
}

/* ============================================================
   OWNER — HISTORY
   Handed-off tickets, newest first, gathered under the day they were
   picked up. Rows stay closed until tapped, so a full thousand of them
   still scrolls smoothly.
   ============================================================ */
function renderHistory() {
  const box = document.getElementById("history-list");
  box.innerHTML = "";

  const past = pastOrders().sort((a, b) => orderStamp(b) - orderStamp(a));

  if (past.length === 0) {
    box.innerHTML = '<div class="rail-empty">' + bi("noPast") + "</div>";
    return;
  }

  const showing = past.slice(0, historyShown);

  // Gather into days, keeping the newest-first order they arrived in
  const days = [];
  const dayIndex = {};

  showing.forEach((order) => {
    const key = String(order.slot).slice(0, 10);      // YYYY-MM-DD
    if (dayIndex[key] === undefined) {
      dayIndex[key] = days.length;
      days.push({ key: key, orders: [] });
    }
    days[dayIndex[key]].orders.push(order);
  });

  days.forEach((day) => {
    const block = document.createElement("div");
    block.className = "day-block";

    const takings = day.orders.reduce((sum, order) => sum + order.total, 0);
    const pupusas = day.orders.reduce((sum, order) => sum + countPupusas(order), 0);

    /* Inside a day, tickets that shared a window and a phone are bundled
       under one heading — the Benitez family's four tickets read as one
       pickup instead of four unrelated rows that happen to sit together. */
    const groups = [];
    const groupIndex = {};

    day.orders.forEach((order) => {
      const key = partyKeyOf(order);
      if (groupIndex[key] === undefined) {
        groupIndex[key] = groups.length;
        groups.push({ slot: order.slot, phone: order.phone, orders: [] });
      }
      groups[groupIndex[key]].orders.push(order);
    });

    groups.sort((a, b) => b.slot.localeCompare(a.slot));   // latest pickup first

    block.innerHTML =
      '<div class="day-head">' +
        '<span class="day-name">' + escapeHtml(longDate(day.key)) + "</span>" +
        '<span class="day-tally">' + day.orders.length + " × " + money(takings) +
        "<br>" + pupusas + " pupusas</span>" +
      "</div>" +
      groups.map(pastGroup).join("");

    box.appendChild(block);
  });

  if (past.length > showing.length) {
    const more = document.createElement("button");
    more.className = "history-more";
    more.innerHTML = bi("showMore", { n: past.length - showing.length });
    more.onclick = () => { historyShown += 60; renderHistory(); };
    box.appendChild(more);
  }

  const note = document.createElement("p");
  note.className = "history-note";
  note.innerHTML = bi("historyCap", { n: MAX_ORDERS });
  box.appendChild(note);
}

function countPupusas(order) {
  return order.items.reduce((sum, line) => sum + line.qty, 0);
}

/* "Miércoles 18 de agosto" — built by hand so both languages read right */
function longDate(dayKey) {
  const date = new Date(dayKey + "T12:00");
  const es = date.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" });
  const en = date.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  return es.charAt(0).toUpperCase() + es.slice(1) + "  ·  " + en;
}

/* One pickup: either a lone ticket, or several bundled under a heading */
function pastGroup(group) {
  const parts = splitTime(new Date(group.slot));
  const clock = parts.clock + " " + parts.meridiem;

  if (group.orders.length === 1) return pastRow(group.orders[0], clock);

  const takings = group.orders.reduce((sum, order) => sum + order.total, 0);
  const pupusas = group.orders.reduce((sum, order) => sum + countPupusas(order), 0);

  return '<div class="party-block">' +
    '<div class="party-head">' +
      '<span class="party-clock">' + clock + "</span>" +
      '<span class="party-phone">' + escapeHtml(group.orders[0].phone) + "</span>" +
      '<span class="party-sum">' + group.orders.length + " × " + money(takings) +
        " · " + pupusas + " pupusas</span>" +
    "</div>" +
    group.orders.map((order) => pastRow(order, "")).join("") +
  "</div>";
}

function pastRow(order, clock) {
  const handed = order.doneAt ? formatTime(new Date(order.doneAt)) : "";

  const lines = order.items.map((line) =>
    '<div class="past-line"><span class="ticket-qty">' + line.qty + "×</span><span>" +
    biPair(line.es, line.en) + "</span></div>"
  ).join("");

  return "<details class='past'>" +
    "<summary>" +
      (clock ? '<span class="past-time">' + clock + "</span>" : "") +
      '<span class="past-name">' + escapeHtml(order.name) + "</span>" +
      '<span class="past-count">' + countPupusas(order) + "</span>" +
      '<span class="past-total">' + money(order.total) + "</span>" +
    "</summary>" +
    '<div class="past-body">' + lines +
      '<div class="past-meta">' +
        "<span>" + ticketNumber(order) + "</span>" +
        '<a href="tel:' + phoneDigits(order.phone) + '">' + escapeHtml(order.phone) + "</a>" +
        (handed ? "<span>" + biText("handedAt") + " " + escapeHtml(handed) + "</span>" : "") +
      "</div>" +
    "</div>" +
  "</details>";
}

async function markComplete(orderId) {
  const order = orders.find((o) => o.id === orderId);
  if (!order) return;

  const doneAt = new Date(serverTime()).toISOString();   // shown in the history tab

  // Show it straight away, then make it stick everywhere
  order.status = "completed";
  order.doneAt = doneAt;
  renderOrders();

  if (db && signedIn) {
    try {
      const result = await db.from("orders")
        .update({ status: "completed", done_at: doneAt })
        .eq("id", orderId);

      // Put it back if the database refused, rather than lie about it
      if (result.error) {
        order.status = "pending";
        order.doneAt = null;
        showToast("saveFailed", true);
        renderOrders();
        return;
      }
    } catch (error) {
      order.status = "pending";
      order.doneAt = null;
      showToast("saveFailed", true);
      renderOrders();
      return;
    }
  }

  trimHistory();
  saveAll();
  renderOrders();
}


/* ============================================================
   OWNER — SETTINGS
   ============================================================ */
let settingsOpen = false;

function buildStepperRow(labelKey, subKey, subVars, value, onMinus, onPlus, canMinus, canPlus) {
  const row = document.createElement("div");
  row.className = "setting-row";

  const text = document.createElement("div");
  text.innerHTML = '<div class="setting-label">' + bi(labelKey) + "</div>" +
                   '<div class="setting-sub">' + biText(subKey, subVars) + "</div>";

  const stepper = document.createElement("div");
  stepper.className = "stepper";

  const minus = document.createElement("button");
  minus.className = "step-btn";
  minus.textContent = "−";
  minus.disabled = !canMinus;
  minus.onclick = onMinus;

  const count = document.createElement("span");
  count.className = "qty";
  count.textContent = value;

  const plus = document.createElement("button");
  plus.className = "step-btn plus";
  plus.textContent = "+";
  plus.disabled = !canPlus;
  plus.onclick = onPlus;

  stepper.append(minus, count, plus);
  row.append(text, stepper);
  return row;
}

function buildMoneyRow(labelKey, subKey, value, onChange) {
  const row = document.createElement("div");
  row.className = "setting-row";

  const text = document.createElement("div");
  text.innerHTML = '<div class="setting-label">' + bi(labelKey) + "</div>" +
                   '<div class="setting-sub">' + biText(subKey) + "</div>";

  const input = document.createElement("input");
  input.className = "money-input";
  input.type = "number";
  input.min = "0";
  input.step = "0.25";
  input.value = value.toFixed(2);
  input.oninput = () => {
    const parsed = parseFloat(input.value);
    onChange(isNaN(parsed) || parsed < 0 ? 0 : parsed);
    renderDealBanner();
    saveAll();
  };

  row.append(text, input);
  return row;
}

function renderSettings() {
  // Every edit below re-renders this panel, so this one line keeps
  // the saved copy in step with whatever the owner just changed.
  saveAll();

  const panel = document.getElementById("settings-panel");
  panel.innerHTML = "";

  const heading = (titleKey, noteKey) => {
    const h = document.createElement("h3");
    h.innerHTML = bi(titleKey);
    const p = document.createElement("p");
    p.className = "settings-note";
    p.innerHTML = bi(noteKey);
    panel.append(h, p);
  };

  const textField = (value, placeholderKey, onType, wide) => {
    const input = document.createElement("input");
    input.className = "name-input" + (wide ? " wide-input" : "");
    input.type = "text";
    input.value = value;
    input.placeholder = biText(placeholderKey);
    input.oninput = () => { onType(input.value); saveAll(); };
    return input;
  };

  /* ---- Shop ---- */
  heading("setShop", "setShopNote");

  const shopRow = document.createElement("div");
  shopRow.className = "menu-edit-row";
  shopRow.append(
    textField(settings.shopName, "shopNamePh",

  );
  panel.appendChild(shopRow);

  heading("setCode", "setCodeNote");

  const codeRow = document.createElement("div");
  codeRow.className = "special-row";

  const codeInput = document.createElement("input");
  codeInput.className = "name-input";
  codeInput.type = "password";
  codeInput.autocomplete = "new-password";
  codeInput.placeholder = biText("newPass");

  const codeButton = document.createElement("button");

  codeButton.innerHTML = bi("changePass");
  codeButton.onclick = async () => {
    const entered = codeInput.value;
    if (entered.length < 6) { showToast("passShort", true); return; }
    if (!db || !signedIn) { showToast("saveFailed", true); return; }

    try {
      const result = await db.auth.updateUser({ password: entered });
      if (result.error) { showToast("saveFailed", true); return; }
    } catch (error) { showToast("saveFailed", true); return; }

    codeInput.value = "";
    showToast("passChanged");
  };

  codeRow.append(codeInput, codeButton);
  panel.appendChild(codeRow);

  /* ---- Days you're open ---- */
  heading("setDays", "setDaysNote");

  const pills = document.createElement("div");
  pills.className = "day-pills";

  DAY_SHORT.forEach((day, index) => {
    const pill = document.createElement("button");
    pill.className = "day-pill" + (settings.openDays.includes(index) ? " on" : "");
    pill.innerHTML = biPair(day.es, day.en);
    pill.onclick = () => {
      if (settings.openDays.includes(index)) {
        settings.openDays = settings.openDays.filter((d) => d !== index);
      } else {
        settings.openDays.push(index);
      }
      renderShopHeader();   // the line of days follows the pills
      renderSettings();
    };
    pills.appendChild(pill);
  });

  panel.appendChild(pills);

    text.innerHTML = '<div class="setting-label">' + bi(labelKey) + "</div>";

    const input = document.createElement("input");
    input.className = "date-input time-input";
    input.type = "time";
    input.value = value;
    input.onchange = () => {
      if (input.value) { onPick(input.value); renderShopHeader(); saveAll(); }
    };

    row.append(text, input);
    return row;

    (v) => { settings.openTime = v; }));
  panel.appendChild(timeRow("closeAt", settings.closeTime,
    (v) => { settings.closeTime = v; }));

  if (settings.closeTime <= settings.openTime) {

    note.className = "settings-note";
    note.innerHTML = bi("overnight");
    panel.appendChild(note);

  dateInput.type = "date";
  dateInput.min = todayKey();

  addDay.className = "tag-button";

    const key = dateInput.value;

    settings.specialDays.push(key);
    settings.specialDays.sort();

  addRow.append(dateInput, addDay);

    none.className = "settings-note";
    none.innerHTML = bi("noSpecial");
    panel.appendChild(none);

    () => { settings.specialSlots = Math.min(24, settings.specialSlots + 1); renderSettings(); },

  /* ---- Capacity ---- */

  panel.appendChild(buildStepperRow(

    () => { settings.ordersPerSlot = Math.max(1, settings.ordersPerSlot - 1); renderSettings(); },
    () => { settings.ordersPerSlot = Math.min(20, settings.ordersPerSlot + 1); renderSettings(); },
    settings.ordersPerSlot > 1, settings.ordersPerSlot < 20
  ));

  panel.appendChild(buildStepperRow(
    "windowHours", "windowHoursSub", null, settings.windowHours,
    () => { settings.windowHours = Math.max(1, settings.windowHours - 1); renderSettings(); },
    () => { settings.windowHours = Math.min(8, settings.windowHours + 1); renderSettings(); },
    settings.windowHours > 1, settings.windowHours < 8
  ));

  panel.appendChild(buildStepperRow(
    "slotLength", "slotLengthSub", null, settings.slotMinutes,

    () => { settings.slotMinutes = Math.min(60, settings.slotMinutes + 5); renderSettings(); },
    settings.slotMinutes > 10, settings.slotMinutes < 60
  ));

  panel.appendChild(buildStepperRow(
    "holdLength", "holdLengthSub", null, settings.holdMinutes,
    () => { settings.holdMinutes = Math.max(1, settings.holdMinutes - 1); renderSettings(); },
    () => { settings.holdMinutes = Math.min(20, settings.holdMinutes + 1); renderSettings(); },
    settings.holdMinutes > 1, settings.holdMinutes < 20
  ));

  panel.appendChild(buildStepperRow(
    "graceSeconds", "graceSecondsSub", null, settings.graceSeconds,
    () => { settings.graceSeconds = Math.max(0, settings.graceSeconds - 15); renderSettings(); },
    () => { settings.graceSeconds = Math.min(300, settings.graceSeconds + 15); renderSettings(); },
    settings.graceSeconds > 0, settings.graceSeconds < 300
  ));

  /* ---- Menu: Spanish name + English name per item ---- */
  heading("setMenu", "setMenuNote");

  menu.forEach((item) => {
    const block = document.createElement("div");
    block.className = "menu-edit-item";

    const row = document.createElement("div");
    row.className = "menu-edit-row";

    const esField = textField(item.es, "itemEsPh", (v) => { item.es = v; });
    const enField = textField(item.en, "itemEnPh", (v) => { item.en = v; });

    const soldButton = document.createElement("button");
    soldButton.className = "tag-button" + (item.soldOut ? " on" : "");
    soldButton.innerHTML = item.soldOut ? bi("soldOut") : bi("available");
    soldButton.onclick = () => {
      item.soldOut = !item.soldOut;
      // The stamp is what keeps an order that's already in someone's
      // cart good for the next minute
      item.soldOutAt = item.soldOut ? new Date(serverTime()).toISOString() : null;
      renderSettings();
    };

    const removeButton = document.createElement("button");
    removeButton.className = "remove-item";
    removeButton.textContent = "×";
    removeButton.onclick = () => {
      menu = menu.filter((other) => other.id !== item.id);
      delete cart[item.id];
      renderSettings();
    };

    // Keep the two buttons together so the × never drops to its own line
    const actions = document.createElement("div");
    actions.className = "edit-actions";
    actions.append(soldButton, removeButton);

    row.append(esField, enField, actions);

    // One pill per day you're open, plus one for surprise days.
    // A lit pill means this item shows up that day.
    const dayRow = document.createElement("div");
    dayRow.className = "day-pills item-days";

    settings.openDays.slice().sort((a, b) => a - b).forEach((index) => {
      const pill = document.createElement("button");
      pill.className = "day-pill" + (item.days.includes(index) ? " on" : "");
      pill.innerHTML = biPair(DAY_SHORT[index].es, DAY_SHORT[index].en);
      pill.onclick = () => {
        if (item.days.includes(index)) {
          item.days = item.days.filter((d) => d !== index);
        } else {
          item.days.push(index);
        }
        renderSettings();
      };
      dayRow.appendChild(pill);
    });

    const specialPill = document.createElement("button");
    specialPill.className = "day-pill star" + (item.special ? " on" : "");
    specialPill.innerHTML = bi("specialPill");
    specialPill.onclick = () => { item.special = !item.special; renderSettings(); };
    dayRow.appendChild(specialPill);

    block.append(row, dayRow);

    // When it was sold out, and how long orders already in a cart
    // will still come through
    if (item.soldOut && item.soldOutAt) {
      const stamp = new Date(item.soldOutAt);
      const until = new Date(stamp.getTime() + settings.graceSeconds * 1000);
      const stillOpen = inGracePeriod(item);

      const note = document.createElement("p");
      note.className = "sold-stamp" + (stillOpen ? " live" : "");
      note.innerHTML = bi("soldOutAtTime", { time: formatTime(stamp) }) +
        (stillOpen ? "<br>" + bi("stillTaking", { time: formatTime(until) }) : "");
      block.appendChild(note);
    }

    panel.appendChild(block);
  });

  const addButton = document.createElement("button");
  addButton.className = "add-item";
  addButton.innerHTML = bi("addItem");
  addButton.onclick = () => {
    menu.push(newMenuItem());
    renderSettings();
  };
  panel.appendChild(addButton);
}

function renderHelp() {
  const panel = document.getElementById("help-panel");
  panel.innerHTML = "";

  HELP.forEach((section) => {
    const heading = document.createElement("h3");
    heading.innerHTML = biPair(section.title.es, section.title.en);
    panel.appendChild(heading);

    section.lines.forEach((line) => {
      const p = document.createElement("p");
      p.className = "help-line";
      p.innerHTML = biPair(line.es, line.en);
      panel.appendChild(p);
    });
  });
}

let helpOpen = false;

/* Only one panel at a time, so the dashboard never gets too long */
function showPanel(which) {
  settingsOpen = which === "settings";
  helpOpen = which === "help";

  document.getElementById("settings-panel").style.display = settingsOpen ? "block" : "none";
  document.getElementById("help-panel").style.display = helpOpen ? "block" : "none";
  document.getElementById("toggle-settings").classList.toggle("on", settingsOpen);
  document.getElementById("toggle-help").classList.toggle("on", helpOpen);

  if (settingsOpen) renderSettings();
  if (helpOpen) renderHelp();
}

document.getElementById("toggle-settings").onclick = () => {
  showPanel(settingsOpen ? "none" : "settings");
};

document.getElementById("toggle-help").onclick = () => {
  showPanel(helpOpen ? "none" : "help");
};

document.getElementById("tab-active").onclick = () => showRail("active");
document.getElementById("tab-history").onclick = () => showRail("history");


/* ============================================================
   ROUTING
   ============================================================ */
let ownerUnlocked = false;
let route = "customer";

function showOnly(id) {
  ["customer-view", "owner-lock", "owner-view"].forEach((viewId) => {
    document.getElementById(viewId).style.display = "none";
  });
  document.getElementById(id).style.display = (id === "owner-lock") ? "grid" : "block";
}

function applyRoute() {
  const wantsOwner = route === "owner";
  document.body.classList.toggle("owner-mode", wantsOwner);

  // Leaving the customer page with a stub up would strand the scroll lock
  hideConfirmation();

  if (!wantsOwner) {
    showOnly("customer-view");
    renderShopHeader();
    renderBunting();
    renderDayNotice();
    renderDealBanner();
    renderMenu();
    renderSlots();
  } else if (ownerUnlocked) {
    showOnly("owner-view");
    showRail("active");   // always land on what's still cooking, and renders
    fetchOrders().then((got) => { if (got) renderOrders(); });
  } else {
    showOnly("owner-lock");

    document.getElementById("t-staff-only").innerHTML = bi("staffOnly");
    document.getElementById("unlock-owner").innerHTML = bi("signIn");
    document.getElementById("lock-error").innerHTML = "";

    document.getElementById("owner-email").focus();
  }
}

function goTo(newRoute) {
  route = newRoute;
  try {
    window.location.hash = (newRoute === "owner") ? "#owner" : "";
  } catch (e) { /* some embedded previews block hash changes */ }
  applyRoute();
}

/* Staff entrance: tap the badge 3 times */
let badgeTaps = 0;
let badgeTimer = null;

document.getElementById("shop-badge").onclick = () => {
  badgeTaps += 1;
  clearTimeout(badgeTimer);
  badgeTimer = setTimeout(() => { badgeTaps = 0; }, 1500);
  if (badgeTaps >= 3) { badgeTaps = 0; goTo("owner"); }
};

document.getElementById("exit-owner").onclick = async () => {
  ownerUnlocked = false;
  signedIn = false;
  stopOrderPolling();

  // Drop the session, otherwise the next person to pick up this phone
  // is still holding the keys to every customer's phone number
  orders = [];
  if (db) { try { await db.auth.signOut(); } catch (error) { /* already gone */ } }

  goTo("customer");
};

/* The dashboard is behind a real account now, not a code kept on
   this phone. That is what stops a stranger reading customer names
   and phone numbers — the database will not hand them over without
   a signed-in session. */
async function tryUnlock() {
  const emailField = document.getElementById("owner-email");
  const passField = document.getElementById("owner-passcode");
  const errorBox = document.getElementById("lock-error");
  const button = document.getElementById("unlock-owner");

  const email = emailField.value.trim();
  const password = passField.value;

  if (!email || !password) {
    errorBox.innerHTML = bi("needBoth");
    return;
  }
  if (!db) {
    errorBox.innerHTML = bi("noNet");
    return;
  }

  button.disabled = true;
  button.innerHTML = bi("signingIn");

  let failed = "wrongLogin";
  try {
    const result = await db.auth.signInWithPassword({ email: email, password: password });
    failed = result.error ? "wrongLogin" : "";
  } catch (error) { failed = "noNet"; }

  button.disabled = false;
  button.innerHTML = bi("signIn");

  if (failed) {
    errorBox.innerHTML = bi(failed);
    passField.value = "";
    passField.focus();
    return;
  }

  signedIn = true;
  await syncClock();
  ownerUnlocked = true;
  passField.value = "";
  errorBox.textContent = "";

  await fetchOrders();
  applyRoute();
  startOrderPolling();
}

document.getElementById("unlock-owner").onclick = tryUnlock;
document.getElementById("owner-passcode").onkeydown = (event) => {
  if (event.key === "Enter") tryUnlock();
};
document.getElementById("owner-email").onkeydown = (event) => {
  if (event.key === "Enter") document.getElementById("owner-passcode").focus();
};

function routeFromHash() {
  return window.location.hash.toLowerCase() === "#owner" ? "owner" : "customer";
}

window.addEventListener("hashchange", () => {
  route = routeFromHash();
  applyRoute();
});

window.addEventListener("resize", renderBunting);

/* ============================================================
   STAYING IN STEP

   Two timers. The customer page checks how full the windows are,
   so a time that filled up on someone else's phone greys out here
   too. The kitchen re-reads its tickets, so an order placed at the
   counter appears without anyone refreshing.
   ============================================================ */
const SLOT_REFRESH_MS = 20000;
const ORDER_REFRESH_MS = 15000;

let slotTimer = null;
let orderTimer = null;

/* The whole shop, not just the head count: hours, prices and the menu
   the owner changed a minute ago. Anything already in the cart survives
   this — see unavailableLines. */
/* ============================================================
   PICKING UP A NEW VERSION

   The dashboard publishes which version it's on. A customer page
   running an older one refreshes itself — but never while somebody
   is part way through an order. Those get a bar to tap when they
   are ready.
   ============================================================ */
let updateBar = null;

function midOrder() {
  return cartCount() > 0 || selectedSlotIso !== null ||
         document.getElementById("order-confirmation").style.display !== "none";
}

/* Reloading is only worth doing if the host actually hands over the
   new file. If it doesn't, the same version comes back and we'd be
   stuck in a loop — so each version is tried once, then it's the bar. */
function alreadyTried(version) {
  try {
    if (sessionStorage.getItem("update-tried") === version) return true;
    sessionStorage.setItem("update-tried", version);
  } catch (error) { /* storage blocked — the bar covers it */ }
  return false;
}

function reloadForUpdate(version) {
  // The version on the end is what stops a phone serving its old copy
  window.location.replace(window.location.pathname + "?v=" + encodeURIComponent(version));
}

function showUpdateBar(version) {
  if (updateBar) return;

  updateBar = document.createElement("button");
  updateBar.className = "update-bar";
  updateBar.innerHTML = bi("updateReady");
  updateBar.onclick = () => reloadForUpdate(version);
  document.body.appendChild(updateBar);
}

function checkForUpdate() {
  if (route !== "customer") return;                     // the owner reloads their own
  if (!publishedVersion || publishedVersion === APP_VERSION) return;

  if (midOrder() || alreadyTried(publishedVersion)) {
    showUpdateBar(publishedVersion);
    return;
  }
  reloadForUpdate(publishedVersion);
}

async function refreshCustomerPage() {
  await syncClock();
  await fetchShopState();
  await fetchSlotCounts();
  renderShopHeader();
  renderDayNotice();
  renderDealBanner();
  renderMenu();
  renderSlots();
  checkForUpdate();
}

function startSlotPolling() {
  if (slotTimer || !db) return;
  slotTimer = setInterval(async () => {
    if (route !== "customer" || document.hidden) return;
    await refreshCustomerPage();
  }, SLOT_REFRESH_MS);
}

function startOrderPolling() {
  if (orderTimer || !db) return;
  orderTimer = setInterval(async () => {
    if (route !== "owner" || !signedIn || document.hidden) return;
    await syncClock();
    if (await fetchOrders()) renderOrders();
  }, ORDER_REFRESH_MS);
}

function stopOrderPolling() {
  clearInterval(orderTimer);
  orderTimer = null;
}

/* Coming back to the tab after a while: catch up straight away
   rather than waiting out the timer */
document.addEventListener("visibilitychange", async () => {
  if (document.hidden) return;

  if (route === "customer") {
    await refreshCustomerPage();
  } else if (signedIn) {
    if (await fetchOrders()) renderOrders();
  }
});


/* ---- start ---- */
loadAll();          // whatever this phone remembered, so nothing flashes empty
renderStaticText();
route = routeFromHash();
applyRoute();

/* Then the shared copy takes over: real hours, real menu, real
   head count for each window. */
(async function syncUp() {
  if (!db) return;

  // A signed-in owner who reopened the page keeps their session
  try {
    const session = await db.auth.getSession();
    signedIn = !!(session.data && session.data.session);
  } catch (error) { signedIn = false; }

  await syncClock();
  await fetchShopState();
  await fetchSlotCounts();

  if (route === "customer") {
    renderShopHeader();
    renderDayNotice();
    renderDealBanner();
    renderMenu();
    renderSlots();
    checkForUpdate();
  }

  startSlotPolling();
  if (signedIn) startOrderPolling();
})();
</script>
