<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- The page is already bilingual, so browsers must leave it alone.
     Without this, Chrome translates the Spanish lines and both
     lines end up in English. -->
<meta name="google" content="notranslate">

<title>Pupusas in Red Oak</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   DESIGN TOKENS — colors taken from the flyer
   ============================================================ */
:root {
  --ink:        #2B1A0F;
  --surface:    #FFF6E6;
  --card:       #FFFFFF;
  --blue:       #0F47AF;
  --blue-deep:  #093279;
  --gold:       #F5B921;
  --gold-deep:  #9A6B04;
  --chile:      #C2411F;
  --green:      #2E7D52;
  --line:       #E8D9BE;
  --muted:      #7A6551;
  --rail:       #241408;
  --wood:       #532411;

  /* Sampled straight off the logo */
  --logo-gold:  #EAC273;
  --logo-red:   #A31A16;
  --logo-blue:  #1B4482;
  --logo-dark:  #2A1206;

  --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --body:    "DM Sans", system-ui, sans-serif;
  --mono:    "DM Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0; background: var(--wood); color: var(--ink);
  font-family: var(--body); line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Wood planks behind everything — same texture as the shop header.
   Fixed, so the page reads as a sheet of paper on a table. */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1;
  background-color: var(--wood);
  background-image:
    repeating-linear-gradient(90deg, rgba(0,0,0,0.20) 0 2px, transparent 2px 11px),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 7px);
}

body.owner-mode::before { display: none; }

/* Photo band from the flyer, sitting under the papel picado */
.food-band {
  height: 168px;
  background-image: var(--food-photo);
  background-size: cover;
  background-position: center 62%;
  background-repeat: no-repeat;
}

/* The cream sheet the whole order page lives on. The negative top
   margin tucks its rounded corners over the bottom of the photo. */
.wrap {
  position: relative; z-index: 1;
  max-width: 640px; margin: -26px auto 34px; padding: 6px 18px 46px;
  background: var(--surface); border-radius: 22px;
  box-shadow: 0 -6px 22px rgba(0, 0, 0, 0.30);
}

/* The English line that sits under every Spanish line */
.en-line {
  display: block;
  font-size: 0.8em; font-weight: 400; font-style: normal;
  letter-spacing: 0; text-transform: none;
  color: var(--muted); line-height: 1.35;
}

.eyebrow {
  font-family: var(--mono); font-size: 0.72rem;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--blue); margin: 0 0 4px;
}

h2 {
  font-family: var(--display); font-weight: 800;
  font-size: 1.45rem; letter-spacing: -0.02em; margin: 0 0 6px;
}

h2 .en-line { font-size: 0.62em; color: var(--muted); margin-top: 1px; }

/* Numbered step heading: a round number sitting next to the title.
   The numeral works in both languages, so it needs no label. */
.step-head {
  display: flex; align-items: center; gap: 12px;
  margin: 0 0 8px;
}

.step-head h2 { margin: 0; }

.step-num {
  width: 38px; height: 38px; flex: none;
  display: grid; place-items: center; border-radius: 50%;
  background: var(--blue); color: #FFFFFF;
  box-shadow: 0 3px 0 var(--blue-deep);
  font-family: var(--display); font-weight: 800; font-size: 1.15rem;
  line-height: 1;
}

.hint { color: var(--muted); font-size: 0.92rem; margin: 0 0 16px; }
.hint .en-line { color: #9A8873; font-size: 0.92em; }

section { padding-top: 30px; }

/* ============================================================
   SHOP HEADER
   ============================================================ */
.shop-bar {
  color: #FFF6E6; padding: 20px 18px 22px;
  background-color: var(--wood);
  background-image:
    repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 2px, transparent 2px 11px),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 7px);
}

.shop-bar .inner {
  max-width: 640px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px;
}

.shop-mark {
  width: 60px; height: 60px; flex: none;
  border-radius: 50%;
  background-image: var(--logo);
  background-size: cover; background-position: center;
  border: 3px solid #FFF6E6;
  cursor: pointer; user-select: none;
}

/* The shop name wears the logo's gold. The gradient gives it the same
   metallic look as the lettering on the emblem. */
.shop-bar h1 {
  font-family: var(--display); font-weight: 800;
  font-size: 1.4rem; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 5px;
  color: var(--logo-gold);
  text-shadow: 2px 2px 0 var(--logo-dark);
}

@supports (-webkit-background-clip: text) {
  .shop-bar h1 {
    background-image: linear-gradient(#F8E5B4, #E3B65C 55%, #B98529);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
    filter: drop-shadow(2px 2px 0 var(--logo-dark));
  }
}

/* The days pill echoes the red banner under the name on the logo */
.shop-sub {
  display: inline-block; margin: 0;
  background: var(--logo-red); border-radius: 4px; padding: 3px 9px;
  font-family: var(--mono); font-size: 0.66rem;
  letter-spacing: 0.09em; text-transform: uppercase; color: #FBE9C2;
}

.shop-sub-en {
  display: block; margin: 4px 0 0;
  font-family: var(--mono); font-size: 0.64rem;
  letter-spacing: 0.09em; text-transform: uppercase; color: #C9B79A;
}

/* Opening and closing times, right under the days */
.shop-hours {
  display: block; margin: 6px 0 0;
  font-family: var(--mono); font-size: 0.74rem;
  letter-spacing: 0.06em; color: var(--logo-gold);
}

/* Papel picado */
.bunting { display: flex; height: 20px; overflow: hidden; }
.bunting i { flex: 0 0 24px; height: 20px; clip-path: polygon(0 0, 100% 0, 50% 100%); }
.bunting i:nth-child(3n+1) { background: var(--blue); }
.bunting i:nth-child(3n+2) { background: #FFFFFF; }
.bunting i:nth-child(3n+3) { background: var(--gold); }

/* ============================================================
   DAY NOTICES — closed today, special day, upcoming surprise
   ============================================================ */
.notice-card {
  border-radius: 14px; padding: 16px; margin-bottom: 16px;
  border: 2px solid var(--line); background: var(--card);
}

.notice-card.closed { border-color: var(--chile); background: #FDF0EC; }
.notice-card.special { border-color: var(--blue); background: #EDF2FD; }
.notice-card.heads-up { border-style: dashed; border-color: var(--blue); background: #FFFFFF; }

.notice-title {
  font-family: var(--display); font-weight: 800;
  font-size: 1.15rem; line-height: 1.25; margin: 0 0 6px;
}

.notice-title .en-line { font-size: 0.75em; }
.notice-card.closed .notice-title { color: var(--chile); }
.notice-card.special .notice-title,
.notice-card.heads-up .notice-title { color: var(--blue-deep); }

.notice-body { font-size: 0.95rem; line-height: 1.35; margin: 0 0 4px; }
.notice-body .en-line { font-size: 0.85em; }

/* Day-of-week pickers in Settings */
.day-pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }

.day-pill {
  flex: 1 1 62px; padding: 8px 4px; text-align: center; line-height: 1.25;
  font-family: var(--mono); font-size: 0.7rem; text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--muted); cursor: pointer;
}

.day-pill .en-line { font-size: 0.9em; letter-spacing: 0; }
.day-pill.on { background: var(--blue); border-color: var(--blue); color: #FFFFFF; }
.day-pill.on .en-line { color: rgba(255,255,255,0.75); }

.special-row {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 10px 0; border-bottom: 1px solid var(--line);
}

.date-input {
  flex: 1 1 160px; padding: 10px;
  font-family: var(--mono); font-size: 0.95rem; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
}

.special-label { flex: 1; font-size: 0.95rem; line-height: 1.3; }
.special-label .en-line { font-size: 0.82rem; }

/* Time pickers sit on the right of a setting row, not stretched */
.time-input { flex: none; width: 140px; }

/* ============================================================
   DEAL STAMP
   ============================================================ */
.deal-banner {
  display: flex; align-items: center; gap: 14px;
  border-radius: 14px; padding: 14px 16px; margin-bottom: 16px;
  color: #FFF6E6;
  background-color: var(--wood);
  background-image: repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 2px, transparent 2px 11px);
}

.deal-main {
  flex: none;
  font-family: var(--display); font-weight: 800;
  font-size: 2rem; line-height: 1; color: #FFFFFF;
  text-shadow: 3px 3px 0 var(--ink); letter-spacing: -0.02em;
}

.deal-sub { font-size: 0.88rem; color: #F6E9CE; }
.deal-sub .en-line { color: #C9B79A; }

/* ============================================================
   MENU
   ============================================================ */
.menu-item {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 10px; border-bottom: 2px dotted var(--line);
}

.menu-item.active { background: #FFFBF0; }
.menu-item.soldout { opacity: 0.5; }

/* Something already in the cart that just sold out. Not faded like a
   plain sold-out row — it needs an answer, so it stays legible. */
.menu-item.gone { background: #FDF0EC; }

.gone-flag {
  margin: 3px 0 0;
  font-family: var(--mono); font-size: 0.66rem;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--chile);
}

.gone-flag .en-line { color: #C2735E; letter-spacing: 0.08em; }

.step-btn.remove-gone { border-color: var(--chile); color: var(--chile); }

/* When an item was sold out, shown to the owner in Settings */
.sold-stamp {
  margin: 0 0 10px;
  font-family: var(--mono); font-size: 0.68rem;
  letter-spacing: 0.06em; line-height: 1.6; color: var(--muted);
}

.sold-stamp .en-line { font-size: 0.92em; letter-spacing: 0.06em; }
.sold-stamp.live { color: var(--chile); }
.sold-stamp.live .en-line { color: #C2735E; }

.menu-dot {
  width: 9px; height: 9px; flex: none; border-radius: 50%;
  background: var(--gold); border: 1px solid var(--gold-deep);
}

.menu-info { flex: 1; min-width: 0; }

.menu-name {
  font-family: var(--display); font-weight: 700;
  font-size: 1.05rem; line-height: 1.25; margin: 0;
}

.menu-name .en-line {
  font-family: var(--body); font-weight: 400; font-size: 0.82rem;
}

.sold-flag {
  font-family: var(--mono); font-size: 0.68rem;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--chile); flex: none; text-align: right; line-height: 1.3;
}

.stepper { display: flex; align-items: center; gap: 6px; flex: none; }

.step-btn {
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
  font-size: 1.25rem; line-height: 1; cursor: pointer;
}

.step-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.step-btn.plus { background: var(--blue); border-color: var(--blue); color: #FFFFFF; }
.step-btn:active { transform: translateY(1px); }

.qty {
  width: 26px; text-align: center;
  font-family: var(--mono); font-size: 1.1rem; font-weight: 500;
}

.qty.zero { color: #C6B79E; }

.cart-strip {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; margin-top: 16px; padding: 14px 16px; border-radius: 12px;
  background: var(--blue); color: #FFFFFF;
  font-family: var(--mono); font-size: 0.95rem;
}

.cart-strip.empty { background: #F1E6D2; color: var(--muted); }
.cart-strip.incomplete { background: var(--chile); }
/* Price sits on its own line, with the "pay at pickup" note stacked under it
   so the two never run together. */
.cart-strip .right {
  display: flex; flex-direction: column; align-items: flex-end;
  gap: 4px; text-align: right;
}
.cart-strip .money { font-size: 1.05rem; line-height: 1.1; }
.cart-strip .en-line { color: rgba(255,255,255,0.75); font-size: 0.72rem; }
.cart-strip .pay {
  font-size: 0.72rem; line-height: 1.25;
  color: rgba(255,255,255,0.85);
}
.cart-strip.empty .pay, .cart-strip.empty .en-line { color: var(--muted); }

.deal-nudge {
  margin: 8px 2px 0; font-size: 0.9rem; font-weight: 500;
  color: var(--chile); min-height: 20px;
}

.deal-nudge .en-line { color: #B4735E; font-weight: 400; }

/* ============================================================
   TIME SLOTS
   ============================================================ */
#slot-list {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(142px, 1fr)); gap: 10px;
}

.slot-button {
  position: relative; text-align: left; padding: 14px 14px 12px;
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--card); font-family: var(--body); color: var(--ink);
  cursor: pointer; transition: transform 0.12s ease, box-shadow 0.12s ease;
}

.slot-button:hover { box-shadow: 0 3px 0 var(--line); }
.slot-button:active { transform: translateY(1px); }

.slot-time {
  display: block; font-family: var(--mono);
  font-size: 1.5rem; font-weight: 500; letter-spacing: -0.02em;
}

.slot-meridiem { font-size: 0.85rem; color: var(--muted); }

.slot-state {
  display: block; margin-top: 6px;
  font-family: var(--mono); font-size: 0.66rem;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--green);
  line-height: 1.4;
}

.slot-state .en-line { font-size: 0.92em; color: #9A8873; letter-spacing: 0.1em; }
.slot-state.low { color: var(--gold-deep); }

.slot-button.booked {
  background: #F1E6D2; border-style: dashed;
  color: #A2947F; cursor: not-allowed; box-shadow: none;
}

.slot-button.booked .slot-state { color: var(--chile); }
.slot-button.booked .slot-meridiem { color: #A2947F; }

.slot-button.selected {
  background: var(--gold); border-color: var(--gold);
  box-shadow: 0 3px 0 var(--gold-deep);
}

.slot-button.selected .slot-state,
.slot-button.selected .slot-meridiem { color: var(--ink); }
.slot-button.selected .slot-state .en-line { color: #6B4E10; }

/* Times stay shut until the cart is a full set of 3 */
.slot-button.locked {
  background: var(--card); border-style: dashed; opacity: 0.5;
  color: #BCAF9A; cursor: not-allowed; box-shadow: none;
}

.slot-button.locked .slot-state,
.slot-button.locked .slot-meridiem { color: #BCAF9A; }

.slot-lock {
  margin: 0 0 14px; font-size: 0.92rem; font-weight: 500;
  color: var(--gold-deep);
}

.slot-lock .en-line { color: #9A8873; font-weight: 400; }

/* ============================================================
   ORDER FORM
   ============================================================ */
.panel {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 18px;
}

.selected-slot-label {
  font-family: var(--mono); font-size: 0.85rem;
  background: #FDF0D3; border-radius: 8px; padding: 10px 12px; margin: 0 0 16px;
}

.selected-slot-label .en-line { color: #8A7355; font-size: 0.85em; }

/* Countdown while the customer fills in their details */
.hold-timer {
  font-family: var(--mono); font-size: 0.76rem;
  letter-spacing: 0.06em; text-transform: uppercase;
  background: #EDF2FD; color: var(--blue-deep);
  border-radius: 8px; padding: 9px 12px; margin: -8px 0 16px;
  line-height: 1.4;
}

.hold-timer .en-line { color: #6C86B5; font-size: 0.9em; letter-spacing: 0.06em; }
.hold-timer.urgent { background: #FBE3DC; color: var(--chile); }
.hold-timer.urgent .en-line { color: #C2735E; }

/* Shown by the times once a hold has run out */
.hold-note { color: var(--chile); font-size: 0.92rem; margin: 0 0 14px; }
.hold-note .en-line { color: #B4735E; }

/* The countdown ran out — this needs to be impossible to miss */
.hold-note.expired {
  padding: 13px 15px; border-radius: 10px; font-weight: 500;
  background: #FBE9E2; border: 1px solid var(--chile); border-left-width: 5px;
}

#order-form label {
  display: block; margin-bottom: 14px;
  font-family: var(--mono); font-size: 0.72rem;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
}

#order-form label .en-line { color: #9A8873; font-size: 0.92em; }

#order-form input {
  display: block; width: 100%; margin-top: 6px; padding: 13px 14px;
  font-family: var(--body); font-size: 1rem; color: var(--ink);
  letter-spacing: normal; text-transform: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}

#order-form input:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
#customer-phone { font-family: var(--mono); }

/* Names go up in caps as they're typed — easier to read off a ticket.
   The placeholder is written in caps too, and forced here, since some
   browsers don't pass text-transform down to placeholder text. */
#customer-name { text-transform: uppercase; }
#customer-name::placeholder { text-transform: uppercase; }

/* Blank room under the form so it can be scrolled clear up to the top of
   the screen, out from under the on-screen keyboard. It lives inside the
   form section, so it only takes up space while the form is open. Width
   alone would miss tablets — an iPad is 768px across in portrait — so
   this also catches anything driven by a finger rather than a mouse. */
.form-room { height: 0; }

@media (max-width: 760px), (pointer: coarse) {
  .form-room { height: 55vh; }
}

#submit-order {
  width: 100%; padding: 14px;
  font-family: var(--display); font-weight: 700; font-size: 1.02rem;
  color: var(--ink); background: var(--gold);
  border: none; border-radius: 10px;
  box-shadow: 0 3px 0 var(--gold-deep); cursor: pointer;
}

#submit-order .en-line { color: #6B4E10; font-size: 0.78rem; }
#submit-order:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gold-deep); }

.form-error { color: var(--chile); font-size: 0.9rem; margin: 0 0 12px; }
.form-error .en-line { color: #B4735E; }

/* ============================================================
   CONFIRMATION STUB
   ============================================================ */
.stub {
  position: relative; background: var(--card);
  border: 1px solid var(--line); border-radius: 14px;
  padding: 20px; overflow: hidden;
}

.stub::before, .stub::after {
  content: ""; position: absolute; top: 104px;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--line);
}

.stub::before { left: -10px; }
.stub::after { right: -10px; }

.stub-head {
  font-family: var(--display); font-weight: 800;
  font-size: 1.3rem; line-height: 1.2; margin: 0 0 2px;
}

.stub-head .en-line { font-size: 0.72em; }

.stub-time {
  display: block; font-family: var(--mono); font-size: 2.6rem;
  font-weight: 500; letter-spacing: -0.03em; margin: 10px 0 22px;
}

.stub-divider { border-top: 2px dashed var(--line); margin: 0 -20px 16px; }

.stub-row {
  display: flex; justify-content: space-between;
  gap: 12px; font-size: 0.92rem; padding: 4px 0;
}

.stub-row span:first-child {
  font-family: var(--mono); font-size: 0.72rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); padding-top: 3px;
}

.stub-row span:last-child { font-weight: 500; text-align: right; }
.stub-row .en-line { text-align: right; font-size: 0.78rem; }
/* One person with several orders at the same window is one trip with
   several bags. The stub lists every bag on one card, so they hold up
   a single screen instead of hunting through four confirmations. */
.stub-bags-head {
  font-family: var(--mono); font-size: 0.68rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 8px;
}

.stub-bag { padding: 8px 0; border-bottom: 1px dashed var(--line); }
.stub-bag:last-child { border-bottom: 0; }

.stub-bag-head {
  display: flex; justify-content: space-between; gap: 12px;
  font-family: var(--mono); font-size: 0.8rem;
  letter-spacing: 0.06em; color: var(--blue); margin-bottom: 2px;
}

.stub-bag .stub-row { padding: 2px 0; }

.stub-row.total { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; }
.stub-row.total span:last-child { font-family: var(--mono); font-size: 1.05rem; }

.ghost-button {
  width: 100%; margin-top: 18px; padding: 12px;
  font-family: var(--body); font-size: 0.95rem;
  background: transparent; border: 1px solid var(--ink);
  border-radius: 10px; cursor: pointer;
}

.ghost-button .en-line { font-size: 0.8rem; }

/* The stub comes up over the page instead of sitting in it, so a
   confirmed order can't be scrolled away from by accident. The only
   ways out are the two buttons on it — tapping the backdrop does
   nothing on purpose. */
.stub-overlay {
  position: fixed; inset: 0; z-index: 40;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 18px; overflow-y: auto;
  background: rgba(43, 26, 12, 0.6);
}

.stub-overlay .stub { width: 100%; max-width: 440px; margin: auto 0; }

function fill(text, vars) {
  if (!vars) return text;
  Object.keys(vars).forEach((name) => {
    text = text.split("{" + name + "}").join(vars[name]);
  });
  return text;
}

// Spanish on top, English underneath — returns HTML
function bi(key, vars) {
  const pair = T[key];
  return escapeHtml(fill(pair.es, vars)) +
         '<span class="en-line" lang="en">' + escapeHtml(fill(pair.en, vars)) + "</span>";
}

// Same idea for any two plain strings (used for menu item names)
function biPair(spanish, english) {
  const top = escapeHtml(spanish || "");
  return english ? top + '<span class="en-line" lang="en">' + escapeHtml(english) + "</span>" : top;
}

// Plain text version, for places that can't hold markup
function biText(key, vars) {
  const pair = T[key];
  return fill(pair.es, vars) + " / " + fill(pair.en, vars);
}

   A phone with the wrong time set would get a longer or shorter
   grace minute than you meant. So the times that have to agree
   across devices are read off the database's clock, not off the
   phone the page happens to be open on.

   How far this device is from that clock, in milliseconds. It stays
   at 0 until the first check, and if the check never works the app
   falls back to this phone's own clock, exactly as it did before.
   ------------------------------------------------------------ */
/* ------------------------------------------------------------
   WHICH VERSION OF THE APP THIS IS

   Bump this whenever the file itself changes. Your dashboard puts
   this number in the database every time you sign in or save, and
   every customer page checks it. A phone still running an older
   file refreshes itself, so nobody is left on last week's version.
   ------------------------------------------------------------ */
const APP_VERSION = "2026-08-19";

/* The version your dashboard last published */
let publishedVersion = "";

let clockOffset = 0;

function serverTime() { return Date.now() + clockOffset; }

async function syncClock() {
  if (!db) return;
  try {
    const before = Date.now();
    const result = await db.rpc("server_now");
    const after = Date.now();

    if (result.error || !result.data) return;

    const stamp = new Date(result.data).getTime();
    if (isNaN(stamp)) return;

    // The answer was true somewhere in the middle of the round trip,
    // so the halfway point is the closest guess at "when it was sent"
    clockOffset = stamp - (before + (after - before) / 2);
  } catch (error) { /* no answer — this phone's clock stands in */ }
}

/* How many separate parties hold each pickup time, keyed by the
   same local timestamp the slots use. Filled from the database.  */
let slotCounts = {};

/* Pull the per-slot head count. No names or phones come back. */
async function fetchSlotCounts() {
  if (!db) return;
  try {
    const result = await db.rpc("slot_load");
    if (result.error || !Array.isArray(result.data)) return;

    const fresh = {};
    result.data.forEach((row) => { fresh[row.slot] = Number(row.parties) || 0; });
    slotCounts = fresh;
  } catch (error) { /* offline — keep the last counts we had */ }
}

/* Send one order up. Returns true only if the database took it. */
async function pushOrder(order) {
  if (!db) return false;
  try {
    const result = await db.from("orders").insert({
      id: order.id, name: order.name, phone: order.phone, slot: order.slot,
      items: order.items, total: order.total, status: order.status,
      placed_at: order.placedAt
    });
    return !result.error;
  } catch (error) { return false; }
}

/* Turn a database row back into the shape the rest of the app uses */
function rowToOrder(row) {
  return {
    id: row.id, name: row.name, phone: row.phone, slot: row.slot,
    items: Array.isArray(row.items) ? row.items : [],
    total: Number(row.total) || 0, status: row.status,
    placedAt: row.placed_at, doneAt: row.done_at
  };
}

/* The kitchen's copy of every order. Signed-in owners only. */
async function fetchOrders() {
  if (!db || !signedIn) return false;
  try {
    const result = await db.from("orders").select("*").order("slot", { ascending: true });
    if (result.error || !Array.isArray(result.data)) return false;

    orders = result.data.map(rowToOrder);
    return true;
  } catch (error) { return false; }
}

/* Hours, prices and the menu, so every customer sees the same shop */
async function fetchShopState() {
  if (!db) return;
  try {
    const result = await db.from("shop_state").select("settings, menu").eq("id", 1).single();
    if (result.error || !result.data) return;

    const remote = result.data;
    if (remote.settings && Object.keys(remote.settings).length > 0) {
      const shopSettings = Object.assign({}, remote.settings);

      // Which version of the file the shop is on. Pulled out here so
      // it never lands in settings and gets treated like an option.
      if (typeof shopSettings.appVersion === "string") {
        publishedVersion = shopSettings.appVersion;
      }
      delete shopSettings.appVersion;

      Object.assign(settings, shopSettings);
    }
    if (Array.isArray(remote.menu) && remote.menu.length > 0) {
      menu = remote.menu;
      menu.forEach((item) => {
        if (!Array.isArray(item.days)) item.days = ALL_DAYS.slice();
        if (typeof item.special !== "boolean") item.special = true;
        if (typeof item.soldOut !== "boolean") item.soldOut = false;
        if (typeof item.soldOutAt !== "string") item.soldOutAt = null;
      });
    }
  } catch (error) { /* offline — the saved copy on this phone stands in */ }
}

/* Push the shop setup back up. Only the owner is allowed to. */
async function pushShopState() {
  if (!db || !signedIn) return;
  try {
    // Everything here is public to customers, so nothing private travels
    const shared = Object.assign({}, settings);
    delete shared.passHash;   // leftover from the old device passcode
    shared.appVersion = APP_VERSION;   // what customer phones check against

    await db.from("shop_state")
      .update({ settings: shared, menu: menu, updated_at: new Date().toISOString() })
      .eq("id", 1);
  } catch (error) { /* it will go up with the next change */ }
}


/* ============================================================
   DATA STORE
   Orders and the cart live here while the page is open. Settings,
   the menu and past orders are also written to this browser's
   storage, so a refresh doesn't wipe everything out.

   This is still one browser talking to itself. Orders placed on a
   customer's phone are saved on THAT phone — they don't travel to
   the kitchen. That needs a server.
   ============================================================ */
let orders = [];
let cart = {};

/* What each pupusa was called when it went into the cart. If the owner
   sells one out or takes it off the menu mid-order, the line has to stay
   on screen with its name intact — dropping it on its own would shrink
   the customer's set of 3 with nothing said about why. */
let cartNames = {};
let selectedSlotIso = null;

/* Bumped to wipe the test tickets. Everything saved lives under this
   key, so a new name means the app opens on a clean slate: no orders,
   default menu, and no passcode set yet. */
const STORE_KEY = "pupusas-red-oak-v2";

/* Some sandboxed previews block storage entirely, so every call is
   wrapped. If saving fails the app keeps working — it just forgets. */
function saveAll() {
  let worked = true;

  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      settings: settings, menu: menu, orders: orders
    }));
  } catch (error) {
    worked = false;   // storage unavailable — say so rather than pretend
  }

  // Hours, prices and the menu belong to the shop, not to this phone
  if (signedIn) pushShopState();

  // Only the owner needs to hear about this
  if (route === "owner") showToast(worked ? "saved" : "saveFailed", !worked);
  return worked;
}

/* A small note that slides up from the bottom and fades out */
let toastTimer = null;

function showToast(key, failed) {
  const box = document.getElementById("toast");
  box.innerHTML = bi(key);
  box.className = "toast show" + (failed ? " failed" : "");

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.className = "toast"; }, 1800);
}

function loadAll() {
  let saved = null;

  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) saved = JSON.parse(raw);
  } catch (error) { return; }   // blocked or corrupt — start from defaults

  if (!saved) return;

  if (saved.settings) Object.assign(settings, saved.settings);
  if (Array.isArray(saved.orders)) orders = saved.orders;

  if (Array.isArray(saved.menu) && saved.menu.length > 0) {
    menu = saved.menu;
    // Fill in anything a save from an older version is missing
    menu.forEach((item) => {
      if (!Array.isArray(item.days)) item.days = ALL_DAYS.slice();
      if (typeof item.special !== "boolean") item.special = true;
      if (typeof item.soldOut !== "boolean") item.soldOut = false;
      if (typeof item.soldOutAt !== "string") item.soldOutAt = null;
    });
  }
}


/* ============================================================
   HELPERS
   ============================================================ */
function toLocalIso(date) {
  const pad = (n) => String(n).padStart(2, "0");
  return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate())
       + "T" + pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":00";
}

function formatTime(date) {
  return date.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
}

function splitTime(date) {
  const parts = formatTime(date).split(/\s+/);
  return { clock: parts[0], meridiem: parts[1] || "" };
}

function money(amount) { return "$" + amount.toFixed(2); }

function makeId() {
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
}

/* ============================================================
   TICKET NUMBERS
   Orders in the same window from the same phone are one pickup, so
   they share a code and differ only by a suffix:

     #EK456 - 1   #EK456 - 2   #EK456 - 3

   The code comes from the window and the phone — not from the order
   id — so it never shifts when one of the bags is handed off, and
   every device works it out to the same five characters.
   ============================================================ */

// No 0/O, 1/I or 5/S: characters that can't be misread off a bag
const TICKET_LETTERS = "2346789ABCDEFGHJKLMNPQRTUVWXYZ";

function partyKeyOf(order) {
  return order.slot + "|" + phoneDigits(order.phone);
}

// Same key in, same five characters out, every time
function partyCode(key) {
  let hash = 2166136261;                          // FNV-1a, 32-bit
  for (let i = 0; i < key.length; i++) {
    hash ^= key.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  hash = hash >>> 0;

  let code = "";
  for (let i = 0; i < 5; i++) {
    code += TICKET_LETTERS[hash % TICKET_LETTERS.length];
    hash = Math.floor(hash / TICKET_LETTERS.length);
  }
  return code;
}

/* Everyone in the pickup, first order placed first. This is the order
   they get numbered in and the order they sit in on the rail, so the
   suffix and the "1 de 3" line always agree. */
function partyMembers(order) {
  const key = partyKeyOf(order);
  return orders
    .filter((other) => partyKeyOf(other) === key)
    .sort((a, b) =>
      String(a.placedAt || "").localeCompare(String(b.placedAt || "")) ||
      String(a.id).localeCompare(String(b.id))
    );
}

function ticketNumber(order) {
  const base = "#" + partyCode(partyKeyOf(order));

  const party = partyMembers(order);
  if (party.length < 2) return base;               // one bag, nothing to number

  const position = party.findIndex((other) => other.id === order.id) + 1;
  return position > 0 ? base + " - " + position : base;
}

function escapeHtml(text) {
  return String(text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function phoneDigits(value) { return String(value).replace(/\D/g, "").slice(0, 10); }

function formatPhone(value) {
  const digits = phoneDigits(value);
  if (digits.length <= 3) return digits;
  if (digits.length <= 6) return digits.slice(0, 3) + "-" + digits.slice(3);
  return digits.slice(0, 3) + "-" + digits.slice(3, 6) + "-" + digits.slice(6);
}


/* ============================================================
   OPEN DAYS — regular weekdays + one-off surprise days
   ============================================================ */

/* A date turned into the plain "YYYY-MM-DD" key we store */
function dateKey(date) {
  const pad = (n) => String(n).padStart(2, "0");
  return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate());
}

/* The reverse: "2026-08-22" back into a real date, in local time */
function dateFromKey(key) {
  const parts = key.split("-").map(Number);
  return new Date(parts[0], parts[1] - 1, parts[2]);
}

function todayKey() { return dateKey(new Date()); }

/* "sábado, 22 de agosto" / "Saturday, August 22" */
function longDate(date, lang) {
  return date.toLocaleDateString(lang === "es" ? "es-ES" : "en-US",
    { weekday: "long", month: "long", day: "numeric" });
}

/* "miércoles, jueves y viernes" / "Wednesdays, Thursdays and Fridays" */
function openDaysList(lang) {
  const names = settings.openDays
    .slice()
    .sort((a, b) => a - b)
    .map((index) => DAY_FULL[index][lang]);

  if (names.length === 0) return "";
  if (names.length === 1) return names[0];

  const last = names.pop();
  return names.join(", ") + (lang === "es" ? " y " : " and ") + last;
}

/* A surprise day the owner added by hand */
function isSpecialDay(date) {
  return settings.specialDays.includes(dateKey(date || new Date()));
}

/* One of the regular weekdays */
function isRegularDay(date) {
  return settings.openDays.includes((date || new Date()).getDay());
}

/* The one question the rest of the page asks: can anyone order right now? */
function isOrderingOpen(date) {
  const day = date || new Date();
  return isSpecialDay(day) || isRegularDay(day);
}

/* Drop surprise days that have already passed, so the list stays short */
function pruneSpecialDays() {
  const today = todayKey();
  settings.specialDays = settings.specialDays.filter((key) => key >= today).sort();
}

/* The next surprise day after today, if there is one */
function nextSpecialDay() {
  pruneSpecialDays();
  const today = todayKey();
  return settings.specialDays.find((key) => key > today) || null;
}


/* ============================================================
   BUSINESS HOURS
   ============================================================ */

/* "17:30" as a real time on the given day */
function timeOn(date, text) {
  const parts = String(text).split(":");
  const stamp = new Date(date);
  stamp.setHours(Number(parts[0]) || 0, Number(parts[1]) || 0, 0, 0);
  return stamp;
}

/* "17:30" written the way customers read it: 5:30 PM */
function prettyTime(text) { return formatTime(timeOn(new Date(), text)); }

/* Today's opening and closing moments. If closing is earlier than
   opening, the kitchen runs past midnight, so closing lands tomorrow. */
function hoursFor(date) {
  const open = timeOn(date, settings.openTime);
  const close = timeOn(date, settings.closeTime);
  if (close <= open) close.setDate(close.getDate() + 1);
  return { open: open, close: close };
}

/* "before" the doors open, "during" service, or "after" closing */
function hoursState() {
  const now = new Date();
  const span = hoursFor(now);
  if (now < span.open) return "before";
  if (now >= span.close) return "after";
  return "during";
}


/* ============================================================
   PRICING — sets of 3 only, $5 per set, any mix
   ============================================================ */
function priceFor(count) {
  return Math.floor(count / settings.bundleQty) * settings.bundlePrice;
}

function missingForSet(count) {
  const leftover = count % settings.bundleQty;
  return leftover === 0 ? 0 : settings.bundleQty - leftover;
}

function isCompleteOrder(count) {
  return count > 0 && count % settings.bundleQty === 0;
}


/* ============================================================
   SHOP HEADER
   ============================================================ */

/* The line under the shop name, built from whichever day pills are
   lit. Spanish joins with "y", English with commas, matching the flyer.
   "Miércoles, jueves y viernes" / "Wednesday, Thursday, Friday" */
function dayLine(lang) {
  const names = settings.openDays
    .slice().sort((a, b) => a - b)
    .map((index) => DAY_ONE[index][lang]);

  if (names.length === 0) return lang === "es" ? "Cerrado" : "Closed";

  let text;
  if (lang === "es") {
    const last = names.pop();
    text = names.length > 0 ? names.join(", ") + " y " + last : last;
  } else {
    text = names.join(", ");
  }

  return text.charAt(0).toUpperCase() + text.slice(1);
}

function renderShopHeader() {
  const name = settings.shopName.trim() || "Your Shop";
  document.getElementById("shop-name").textContent = name;
  document.getElementById("shop-badge").setAttribute("aria-label", name);
  document.getElementById("shop-tagline").textContent = dayLine("es");
  document.getElementById("shop-tagline-en").textContent = dayLine("en");
  document.getElementById("shop-hours").textContent =
    prettyTime(settings.openTime) + " – " + prettyTime(settings.closeTime);
  document.title = name;
}

function renderBunting() {

  const count = Math.ceil(window.innerWidth / 24) + 3;

}


/* ============================================================
   DAY NOTICE — tells the customer what kind of day today is
   ============================================================ */
function noticeCard(kind, titleKey, spanishBody, englishBody) {
  const card = document.createElement("div");
  card.className = "notice-card " + kind;
  card.innerHTML = '<p class="notice-title">' + bi(titleKey) + "</p>" +
                   '<p class="notice-body">' + biPair(spanishBody, englishBody) + "</p>";
  return card;
}

function renderDayNotice() {
  const box = document.getElementById("day-notice");
  box.innerHTML = "";

  const today = new Date();

  if (isSpecialDay(today)) {
    // Today is a surprise day — say so loudly
    box.appendChild(noticeCard("special", "specialTitle",
      fill(T.specialBody.es, { n: settings.specialSlots }),
      fill(T.specialBody.en, { n: settings.specialSlots })
    ));

  } else if (!isRegularDay(today)) {
    // Closed today — the menu still shows, but nothing can be ordered
    const hasDays = settings.openDays.length > 0;
    box.appendChild(noticeCard("closed", "closedTitle",
      hasDays ? fill(T.closedBody.es, { days: openDaysList("es") }) : T.closedNoDays.es,
      hasDays ? fill(T.closedBody.en, { days: openDaysList("en") }) : T.closedNoDays.en
    ));
  }

  // Advertise the next surprise day on any kind of day
  const upcoming = nextSpecialDay();
  if (upcoming) {
    const date = dateFromKey(upcoming);
    box.appendChild(noticeCard("heads-up", "headsUpTitle",
      fill(T.headsUpBody.es, { date: longDate(date, "es") }),
      fill(T.headsUpBody.en, { date: longDate(date, "en") })
    ));
  }

  box.style.display = box.children.length > 0 ? "block" : "none";
}
