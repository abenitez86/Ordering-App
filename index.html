<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordering App</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    margin: 0; padding: 16px;
    background: #f5f5f5; color: #222;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 16px; margin: 20px 0 8px; }

  /* Top tabs to switch between customer page and owner dashboard */
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button {
    flex: 1; padding: 10px; border: 1px solid #ccc;
    background: #fff; border-radius: 8px; font-size: 15px;
  }
  .tabs button.active { background: #222; color: #fff; border-color: #222; }

  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 12px; }

  /* Time slot buttons */
  .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .slot {
    padding: 12px; border: 1px solid #ccc; background: #fff;
    border-radius: 8px; font-size: 15px;
  }
  .slot.selected { background: #222; color: #fff; border-color: #222; }
  .slot:disabled { background: #eee; color: #999; text-decoration: line-through; }

  label { display: block; margin: 12px 0 4px; font-size: 14px; }
  input {
    width: 100%; padding: 12px; font-size: 16px;
    border: 1px solid #ccc; border-radius: 8px;
  }
  .submit {
    width: 100%; padding: 14px; margin-top: 16px; font-size: 16px;
    background: #1a7f37; color: #fff; border: none; border-radius: 8px;
  }

  .msg { padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
  .msg.ok { background: #d7f5dd; color: #12592b; }
  .msg.err { background: #ffdcdc; color: #8a1f1f; }

  /* Owner dashboard order rows */
  .order { border-left: 4px solid #1a7f37; }
  .order.done { border-left-color: #999; opacity: 0.55; }
  .order .time { font-weight: bold; }
  .order .done-btn {
    margin-top: 10px; width: 100%; padding: 10px;
    background: #222; color: #fff; border: none; border-radius: 8px; font-size: 14px;
  }
  .empty { color: #777; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Ordering App</h1>

  <div class="tabs">
    <button id="tabCustomer" class="active" onclick="showView('customer')">Order</button>
    <button id="tabOwner" onclick="showView('owner')">Owner</button>
  </div>

  <!-- ===== CUSTOMER PAGE ===== -->
  <div id="customerView">
    <div id="customerMsg"></div>

    <div class="card">
      <h2>Pick a time slot</h2>
      <div class="slots" id="slotList"></div>

      <label for="name">Full Name</label>
      <input id="name" type="text" placeholder="Your full name">

      <label for="phone">Phone Number</label>
      <input id="phone" type="tel" placeholder="Your phone number">

      <button class="submit" onclick="submitOrder()">Submit Order</button>
    </div>
  </div>

  <!-- ===== OWNER DASHBOARD ===== -->
  <div id="ownerView" style="display:none">
    <h2>All Orders</h2>
    <div id="orderList"></div>
  </div>

</div>

<script>
/* ---------------------------------------------
   DATA STORAGE
   Orders are stored as a JSON array in localStorage.
   Each order: { id, name, phone, slot, status }
--------------------------------------------- */
function getOrders() {
  return JSON.parse(localStorage.getItem("orders") || "[]");
}

function saveOrders(orders) {
  localStorage.setItem("orders", JSON.stringify(orders));
}

/* ---------------------------------------------
   TIME SLOT LOGIC
   - Start at the next 30-minute mark from now
   - Create a slot every 30 minutes for the next 2 hours
   - A slot is unavailable if an order already uses it
--------------------------------------------- */
var HALF_HOUR = 30 * 60 * 1000;
var selectedSlot = null;

function generateSlots() {
  var now = Date.now();
  var start = Math.ceil(now / HALF_HOUR) * HALF_HOUR; // round up to next :00 or :30
  var end = now + (2 * 60 * 60 * 1000);              // 2 hours from now
  var booked = getOrders().map(function (o) { return o.slot; });
  var slots = [];

  for (var t = start; t <= end; t += HALF_HOUR) {
    var date = new Date(t);
    var iso = date.toISOString();
    slots.push({
      time: date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }),
      iso: iso,
      available: booked.indexOf(iso) === -1
    });
  }
  return slots;
}

function renderSlots() {
  var slots = generateSlots();
  var list = document.getElementById("slotList");
  list.innerHTML = "";

  slots.forEach(function (slot) {
    var btn = document.createElement("button");
    btn.className = "slot";
    btn.textContent = slot.time;
    btn.disabled = !slot.available;
    if (slot.iso === selectedSlot) btn.classList.add("selected");
    btn.onclick = function () {
      selectedSlot = slot.iso;
      renderSlots();
    };
    list.appendChild(btn);
  });
}

/* ---------------------------------------------
   SUBMIT AN ORDER
   Name, phone, and a slot are all required.
--------------------------------------------- */
function submitOrder() {
  var name = document.getElementById("name").value.trim();
  var phone = document.getElementById("phone").value.trim();
  var msg = document.getElementById("customerMsg");

  if (!selectedSlot) { showMsg(msg, "Please choose a time slot.", "err"); return; }
  if (!name)         { showMsg(msg, "Please enter your full name.", "err"); return; }
  if (!phone)        { showMsg(msg, "Please enter your phone number.", "err"); return; }

  var orders = getOrders();

  // Safety check in case the slot was taken a moment ago
  var taken = orders.some(function (o) { return o.slot === selectedSlot; });
  if (taken) {
    showMsg(msg, "Sorry, that slot was just booked. Please pick another.", "err");
    selectedSlot = null;
    renderSlots();
    return;
  }

  orders.push({
    id: "ord-" + Date.now(),
    name: name,
    phone: phone,
    slot: selectedSlot,
    status: "pending"
  });
  saveOrders(orders);

  var slotTime = new Date(selectedSlot)
    .toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  showMsg(msg, "Order confirmed for " + slotTime + ". Thank you, " + name + "!", "ok");

  // Reset the form
  selectedSlot = null;
  document.getElementById("name").value = "";
  document.getElementById("phone").value = "";
  renderSlots();
}

function showMsg(box, text, type) {
  box.innerHTML = '<div class="msg ' + type + '">' + text + "</div>";
}

/* ---------------------------------------------
   OWNER DASHBOARD
   Lists every order and allows marking as completed.
--------------------------------------------- */
function renderOrders() {
  var orders = getOrders();
  var list = document.getElementById("orderList");
  list.innerHTML = "";

  if (orders.length === 0) {
    list.innerHTML = '<p class="empty">No orders yet.</p>';
    return;
  }

  // Show earliest time slot first
  orders.sort(function (a, b) { return new Date(a.slot) - new Date(b.slot); });

  orders.forEach(function (order) {
    var time = new Date(order.slot)
      .toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

    var div = document.createElement("div");
    div.className = "card order" + (order.status === "completed" ? " done" : "");
    div.innerHTML =
      '<div class="time">' + time + "</div>" +
      "<div>" + order.name + "</div>" +
      "<div>" + order.phone + "</div>" +
      "<div>Status: " + order.status + "</div>";

    if (order.status === "pending") {
      var btn = document.createElement("button");
      btn.className = "done-btn";
      btn.textContent = "Mark Completed";
      btn.onclick = function () { completeOrder(order.id); };
      div.appendChild(btn);
    }
    list.appendChild(div);
  });
}

function completeOrder(id) {
  var orders = getOrders();
  orders.forEach(function (o) {
    if (o.id === id) o.status = "completed";
  });
  saveOrders(orders);
  renderOrders();
}

/* ---------------------------------------------
   VIEW SWITCHING
--------------------------------------------- */
function showView(view) {
  var isCustomer = view === "customer";
  document.getElementById("customerView").style.display = isCustomer ? "block" : "none";
  document.getElementById("ownerView").style.display = isCustomer ? "none" : "block";
  document.getElementById("tabCustomer").classList.toggle("active", isCustomer);
  document.getElementById("tabOwner").classList.toggle("active", !isCustomer);

  if (isCustomer) renderSlots(); else renderOrders();
}

// Start on the customer page
renderSlots();
</script>
</body>
</html>
